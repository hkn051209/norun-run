<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8c9a0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>シールちょう</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden">
    <button id="who" class="who" aria-label="あそぶ ひとを かえる"><span class="face"></span><span class="nm"></span><small>かわる</small></button>
    <nav id="nav">
      <button data-go="book"><i data-ic="book"></i><span>シールちょう</span></button>
      <button data-go="inv"><i data-ic="bag"></i><span>もちもの</span></button>
      <button data-go="sheets"><i data-ic="sheet"></i><span>シールシート</span></button>
      <button data-go="gacha"><i data-ic="gacha"></i><span>ガチャ</span></button>
      <button data-go="trade"><i data-ic="trade"></i><span>こうかん</span></button>
    </nav>
    <div class="tb-right">
      <span id="tickets" class="ticket" aria-label="ガチャけん"><i data-ic="ticket"></i><b>0</b></span>
      <button id="muteBtn" class="icon-btn" aria-label="おと"><i data-ic="sound"></i></button>
      <button id="lockBtn" class="icon-btn lock" aria-label="ほごしゃ"><i data-ic="lock"></i></button>
    </div>
  </header>
  <main>
    <section id="scr-players" class="screen"></section>
    <section id="scr-book" class="screen"></section>
    <section id="scr-inv" class="screen"></section>
    <section id="scr-sheets" class="screen"></section>
    <section id="scr-gacha" class="screen"></section>
    <section id="scr-trade" class="screen"></section>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="dialog" class="modal dialog hidden"></div>
<div id="celebrate" class="celebrate hidden"></div>
<div id="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/sound.js"></script>
<script src="js/assets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
