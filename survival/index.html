const imgOk = im => !!(im&&im.complete&&im.naturalWidth>0);
const enemyCv={}, enemyImg={}, bgImg={};
/* 絵が画像の端で切れている時（例：ボスカラスの翼の先が、画像の左右の端でまっすぐ切れている）に、切り口を丸い先端に整える。
   画像の四辺を調べ、不透明な部分が端に届いていたら、そこから内側へ向かって楕円形にすぼめる（画像の大きさは変えない）。
   端に届いていない絵には何もしない。画素を読めない環境（HTMLファイルを直接開いた時）では元の絵のまま。 */
const fixCv=new Map();
function fixEdges(im){
  if(!CFG.EDGE_FIX) return null;
  try{
    const w=im.naturalWidth, h=im.naturalHeight; if(!w||!h||w*h>4200000) return null;
    const cvs=document.createElement('canvas'); cvs.width=w; cvs.height=h;
    const g=cvs.getContext('2d'); g.drawImage(im,0,0);
    const id=g.getImageData(0,0,w,h), px=id.data, TH=48; let changed=false;
    for(let side=0;side<4;side++){   // 0=左 1=右 2=上 3=下。i=辺に沿った位置、d=辺からの深さ
      const len=side<2?h:w, dep=side<2?w:h;
      const off=(i,d)=>(side===0?i*w+d:side===1?i*w+(w-1-d):side===2?d*w+i:(h-1-d)*w+i)*4+3;
      let i=0;
      while(i<len){
        if(px[off(i,0)]<TH){ i++; continue; }
        const s=i; while(i<len&&px[off(i,0)]>=TH) i++;
        const e=i-1, L=e-s+1;
        if(L<Math.max(6,len*0.012)||L>len*0.6) continue;   // 小さすぎる点と、辺いっぱいの絵は対象外
        const M=Math.round(clamp(L*0.6,6,dep*0.16)); let cs=s, ce=e;
        for(let d=0;d<M;d++){
          const mid=Math.round((cs+ce)/2); if(px[off(mid,d)]<TH) break;
          let a0=mid, a1=mid; while(a0>0&&px[off(a0-1,d)]>=TH) a0--; while(a1<len-1&&px[off(a1+1,d)]>=TH) a1++;
          cs=a0; ce=a1;
          const t=1-(d+0.5)/M, c0=(a0+a1)/2, half=(a1-a0+1)/2*Math.sqrt(1-t*t);
          for(let j=Math.max(0,a0-1);j<=Math.min(len-1,a1+1);j++){
            const cov=clamp(half-Math.abs(j-c0)+0.5,0,1); if(cov>=1) continue;
            const o=off(j,d); px[o]=Math.round(px[o]*cov); changed=true;
          }
        }
      }
    }
    if(!changed) return null;
    g.putImageData(id,0,0); return cvs;
  }catch(err){ return null; }
}
for(const k in ENEMY_SPRITES){ if(ENEMY_SPRITES[k]){ enemyImg[k]={}; for(const d in ENEMY_SPRITES[k]){
  const im=new Image(); im.onload=()=>{ const f=fixEdges(im); if(f) fixCv.set(im,f); }; im.src=ENEMY_SPRITES[k][d]; enemyImg[k][d]=im; } } }
/* 背景画像を、彩度・明るさ・ぼかしを調整した1枚にしておく（ステージごとに最初の1回だけ作る） */
const bgCv={};
function bgTile(S){
  const im=bgImg[S.id]; if(!imgOk(im)) return null;
  if(bgCv[S.id]) return bgCv[S.id];
  const sat=S.bgSat==null?1:S.bgSat, dim=Math.min(0.9,(S.bgDim||0)+CFG.BG_DIM), soft=S.bgSoft||0;
  if(sat>=1&&dim<=0&&soft<=0) return bgCv[S.id]=im;
  const n=Math.min(1024,im.naturalWidth), mk=k=>{ const q=document.createElement('canvas'); q.width=q.height=k; return q; };
  const cvs=mk(n), g=cvs.getContext('2d'); g.drawImage(im,0,0,n,n);
  if(soft>0){   // 小さくしてから引きのばした絵を重ねて、細かい模様をやわらげる
    const s1=mk(Math.round(n/3)), s2=mk(Math.round(n/9));
    s1.getContext('2d').drawImage(im,0,0,s1.width,s1.height); s2.getContext('2d').drawImage(s1,0,0,s2.width,s2.height);
    g.globalAlpha=Math.min(1,soft); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(s2,0,0,n,n); g.globalAlpha=1;
  }
  if(sat<1){
    g.globalCompositeOperation='saturation';
    if(g.globalCompositeOperation==='saturation'){ g.globalAlpha=1-sat; g.fillStyle='#808080'; g.fillRect(0,0,n,n); }
    else{ g.globalAlpha=(1-sat)*0.5; g.fillStyle='#6a6f78'; g.fillRect(0,0,n,n); }
    g.globalAlpha=1; g.globalCompositeOperation='source-over';
  }
  if(dim>0){ g.fillStyle='rgba(12,14,36,'+dim+')'; g.fillRect(0,0,n,n); }
  return bgCv[S.id]=cvs;
}
/* 状態ごとの色：敵の絵そのものをこの色に寄せ、まわりに同じ色のオーラを出す（mix=色をかぶせる強さ、aura=オーラの濃さ） */
const STATUS = {
  flash: {rgb:'255,255,255',mix:0.78,hue:false,aura:0},   // 攻撃が当たった瞬間
  ice:   {rgb:'140,225,255',mix:0.5, hue:true, aura:0.6},   // こおっている
  zap:   {rgb:'255,228,70', mix:0.45,hue:true, aura:0.65},  // しびれている
  burn:  {rgb:'255,96,28',  mix:0.42,hue:true, aura:0.6},   // もえている
  poison:{rgb:'178,96,255', mix:0.45,hue:true, aura:0.55},  // どく
  slow:  {rgb:'70,125,255', mix:0.4, hue:true, aura:0.4},   // おそくなっている
};
function statusOf(e){ return e.flash>0?'flash':e.stun>0?(e.stunK==='ice'?'ice':'zap'):e.burn>0?'burn':e.poison>0?'poison':e.slow>0?'slow':null; }
const tintCv=new Map();
function tinted(src,key,st,maxPx){   // 色を変えた絵を作って覚えておく（絵×状態ごとに1回だけ）
  const k=key+'|'+st; let t=tintCv.get(k); if(t) return t;
  const S=STATUS[st], sw=src.naturalWidth||src.width, sh=src.naturalHeight||src.height, sc=Math.min(1,maxPx/Math.max(sw,sh));
  t=document.createElement('canvas'); t.width=Math.max(1,Math.round(sw*sc)); t.height=Math.max(1,Math.round(sh*sc));
  const g=t.getContext('2d'), W=t.width, H=t.height;
  g.drawImage(src,0,0,W,H);
  if(S.hue){   // 明るさは残して色あいだけ変える → もとの絵の線や模様が残る
    g.globalCompositeOperation='color';
    if(g.globalCompositeOperation==='color'){ g.fillStyle='rgb('+S.rgb+')'; g.fillRect(0,0,W,H); g.globalCompositeOperation='destination-in'; g.drawImage(src,0,0,W,H); }
  }
  g.globalCompositeOperation='source-atop'; g.fillStyle='rgba('+S.rgb+','+S.mix+')'; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='source-over';
  tintCv.set(k,t); return t;
}
/* 星のかけら・ハート：濃いふちどり＋白いふち＋うしろの発光つきの絵を1回だけ作る（明るい背景でも埋もれない） */
const gemCv={};
function gemSprite(kind){   // 'y'=星のかけら / 'b'=大きいかけら / 'h'=ハート
  if(gemCv[kind]) return gemCv[kind];
  const N=96, m=N/2, cvs=document.createElement('canvas'); cvs.width=cvs.height=N; const g=cvs.getContext('2d');

function drawEnemy(c,e){
  const r=e.r, ks=CFG.ENEMY_SCALE[e.type]||1, rs=r*ks, ey=e.y-e.alt, up=clamp(e.alt/170,0,1), hovering=e.ai==='hand'&&(e.st===0||e.st===4);
  if(!hovering&&e.ai!=='hand'){ c.fillStyle='rgba(0,0,0,'+(0.26-0.12*up).toFixed(2)+')'; c.beginPath(); c.ellipse(e.x,e.y+rs*1.05,rs*(0.72-0.25*up),rs*(0.22-0.07*up),0,0,TAU); c.fill(); }
  // 状態（もえている・どく・しびれ・こおり・おそい）は、絵そのものの色とオーラで見せる
  const st=statusOf(e), S=st?STATUS[st]:null;
  if(S&&S.aura) glow(c,e.x,ey,rs*1.9,S.rgb,S.aura*(0.75+0.25*Math.sin(animT*9+e.wob)));
  if(e.raged) glow(c,e.x,ey,rs*2.1,'255,70,90',0.5+0.25*Math.sin(animT*10));   // 手の いかり
  c.save(); c.translate(e.x,ey);
  // 絵と向き：side/back の絵が使えればそれ（side は右へ進む時に反転）。無ければ正面絵か仮絵（右向きが正、左で反転）
  const set=enemyImg[e.type]||{}, want=set[e.dir];
  let im=null, fl=e.face<0?-1:1;
  if(e.dir!=='front'&&imgOk(want)){ im=want; fl=e.sflip; }
  else if(imgOk(set.front)){ im=set.front; if(e.dir==='front'&&ENEMY_SPRITES[e.type].side) fl=1; }
  let sx=fl, sy=1, rot=Math.sin(animT*6+e.wob)*0.07;
  if(e.ai==='cat'){ if(e.st===1){ sy=0.76; rot=0; } else if(e.st===2){ sx*=1.12; sy=0.9; } }
  else if(e.ai==='bee') c.translate(0,Math.sin(animT*14+e.wob)*2.5);
  else if(e.ai==='dog'){ if(e.st===1) rot=Math.sin(animT*45)*0.06; else if(e.st===2){ sx*=1.1; sy=0.92; } }
  else if(e.ai==='crow'){ sy=e.st===2?0.85:1+Math.sin(animT*12+e.wob)*0.07; if(e.st===1) rot=Math.sin(animT*45)*0.08; }
  else if(e.ai==='hand'){ rot=0; sx=1; if(e.st===1) c.translate(rand(-2,2),rand(-2,2)); else if(e.st!==3) c.translate(0,Math.sin(animT*3+e.wob)*4); }
  else if(e.ai==='roomba'){ rot=Math.sin(animT*20+e.wob)*0.03; }
  c.rotate(rot); c.scale(sx,sy);
  // 絵は切り取らずに丸ごと描く。端で切れていた絵は fixCv に整えた版が入っている
  let src=im?(fixCv.get(im)||im):enemyArt(e.type);
  if(S) src=tinted(src,im?im.src:'art:'+e.type,st,e.boss?512:288);
  if(im){ const h=r*2.7*ks, w=h*im.naturalWidth/im.naturalHeight; c.drawImage(src,-w/2,-h/2,w,h); }
  else{ const size=ART*r/32*ks; c.drawImage(src,-size/2,-size/2,size,size); }
  c.restore();
  if(e.boss){
    const bw=Math.max(r*1.6,rs*1.2), by=e.ai==='hand'?ey+rs*1.55:ey-rs*1.35-13;
    c.fillStyle='#fff'; rr(c,e.x-bw/2-2.5,by-2.5,bw+5,12,6); c.fill();
    c.fillStyle='#5a4374'; rr(c,e.x-bw/2,by,bw,7,3.5); c.fill();
    c.fillStyle='#ff8fb1'; rr(c,e.x-bw/2,by,Math.max(7,bw*clamp(e.hp/e.maxHp,0,1)),7,3.5); c.fill();
  }
}

    const R=27+Math.sin(animT*4)*1.5; c.globalCompositeOperation='lighter';
    c.strokeStyle='rgba(200,180,255,.55)'; c.lineWidth=3; c.beginPath(); c.arc(p.x,p.y,R,0,TAU); c.stroke();
    glow(c,p.x+Math.cos(animT*2.4)*R,p.y+Math.sin(animT*2.4)*R,9,'230,215,255',0.9); c.globalCompositeOperation='source-over';
  }
  // 敵（上空）
  for(const e of G.enemies) if(e.alt>=25) drawEnemy(c,e);

  // かみなり（グロー）
  c.lineCap='round'; c.lineJoin='round'; c.globalCompositeOperation='lighter';
  for(const b of G.bolts){
    const al=clamp(b.life/0.22,0,1);
    c.beginPath(); c.moveTo(b.pts[0][0],b.pts[0][1]); for(let i=1;i<b.pts.length;i++) c.lineTo(b.pts[i][0],b.pts[i][1]);
    c.strokeStyle='rgba(255,190,40,'+(0.35*al).toFixed(2)+')'; c.lineWidth=16; c.stroke();
    c.strokeStyle='rgba(255,232,90,'+(0.7*al).toFixed(2)+')'; c.lineWidth=7; c.stroke();
    c.strokeStyle='rgba(255,255,255,'+al.toFixed(2)+')'; c.lineWidth=2.5; c.stroke();
    const e=b.pts[b.pts.length-1]; glow(c,e[0],e[1],34,'255,236,120',al);
  }
  // 星のシャワー（光る尾）
  for(const f of G.falls){
    const x=f.e.x+f.t*90, y=f.e.y-f.t*520;
    c.strokeStyle='rgba(255,226,122,.35)'; c.lineWidth=9; c.beginPath(); c.moveTo(x,y); c.lineTo(x+24,y-140); c.stroke();
    c.strokeStyle='rgba(255,255,255,.6)'; c.lineWidth=3; c.beginPath(); c.moveTo(x,y); c.lineTo(x+16,y-92); c.stroke();
    glow(c,x,y,30,'255,226,122',0.9);
  }
  // 広がる光の輪（大技・撃破・輪の残像）
  for(const r of G.rings){
    const al=clamp(r.life/r.max,0,1);
    c.beginPath(); c.arc(r.x,r.y,r.r,0,TAU);
    c.strokeStyle='rgba('+r.rgb+','+(0.22*al).toFixed(2)+')'; c.lineWidth=r.w*3; c.stroke();
    c.strokeStyle='rgba('+r.rgb+','+(0.7*al).toFixed(2)+')'; c.lineWidth=r.w; c.stroke();
  }
  c.globalCompositeOperation='source-over';
  for(const f of G.falls){ c.fillStyle='#fff6c8'; starPath(c,f.e.x+f.t*90,f.e.y-f.t*520,11,animT*6); c.fill(); }
  // 粒子
  for(const f of G.fx){
    const a=clamp(f.life/f.max,0,1);
    switch(f.k){
      case 'star': c.globalAlpha=a; c.fillStyle=f.color; starPath(c,f.x,f.y,f.r*(0.45+0.55*a),f.rot); c.fill(); break;
      case 'shard':{ const co=Math.cos(f.rot)*f.r, si=Math.sin(f.rot)*f.r;
        c.globalAlpha=a; c.fillStyle=f.color; c.beginPath(); c.moveTo(f.x+co,f.y+si); c.lineTo(f.x-si*0.38,f.y+co*0.38); c.lineTo(f.x-co,f.y-si); c.lineTo(f.x+si*0.38,f.y-co*0.38); c.closePath(); c.fill(); break; }
      case 'bubble':{ const R=f.r*(1.4-0.5*a);   // 毒の泡：うすく塗った丸＋ふち＋白い点
        c.beginPath(); c.arc(f.x,f.y,R,0,TAU); c.globalAlpha=a*0.35; c.fillStyle=f.color; c.fill();
        c.globalAlpha=a; c.strokeStyle=f.color; c.lineWidth=1.8; c.stroke();
        c.fillStyle='#fff'; c.beginPath(); c.arc(f.x-R*0.35,f.y-R*0.35,R*0.22,0,TAU); c.fill(); break; }
      case 'smoke': c.globalAlpha=a*0.3; c.fillStyle=f.color; c.beginPath(); c.arc(f.x,f.y,f.r*(2.3-1.3*a),0,TAU); c.fill(); break;
      case 'spark': c.globalAlpha=a; c.strokeStyle=f.color; c.lineWidth=2; c.beginPath(); c.moveTo(f.x,f.y); c.lineTo(f.x-f.vx*0.045,f.y-f.vy*0.045); c.stroke(); break;
      case 'ember': c.globalAlpha=a*(0.65+0.35*Math.sin(f.rot+animT*30)); c.fillStyle=f.color; c.beginPath(); c.arc(f.x,f.y,f.r*a+0.6,0,TAU); c.fill(); break;
      case 'drop':{ const q=Math.atan2(f.vy,f.vx)+Math.PI/2;   // 水しぶき：しずく形＋白い光
        c.globalAlpha=a; c.fillStyle=f.color; c.beginPath(); c.ellipse(f.x,f.y,f.r*0.62,f.r*1.3,q,0,TAU); c.fill();
        c.fillStyle='rgba(255,255,255,.85)'; c.beginPath(); c.ellipse(f.x-f.r*0.15,f.y-f.r*0.2,f.r*0.2,f.r*0.42,q,0,TAU); c.fill(); break; }
      case 'foam': c.globalAlpha=a; c.fillStyle='#fff'; c.beginPath(); c.arc(f.x,f.y,f.r*(0.5+0.5*a),0,TAU); c.fill();
        c.strokeStyle='#7cc4ff'; c.lineWidth=1.2; c.stroke(); break;
      case 'ripple':{ const R=f.r*(1+(1-a)*2.4);   // 地面に広がる波紋
        c.globalAlpha=a*0.9; c.strokeStyle='#ffffff'; c.lineWidth=2.2; c.beginPath(); c.ellipse(f.x,f.y,R,R*0.5,0,0,TAU); c.stroke();
        c.strokeStyle='#4da8ff'; c.lineWidth=1.4; c.beginPath(); c.ellipse(f.x,f.y,R*0.6,R*0.3,0,0,TAU); c.stroke(); break; }
      case 'flame':{ const R=f.r*(0.35+0.65*a), x=f.x+Math.sin(f.rot+animT*18)*1.2;   // 炎：はじめは黄、消えぎわは赤
        c.globalAlpha=Math.min(1,a*1.6); c.fillStyle=a>0.6?'#ffb21f':a>0.3?'#ff6f1a':'#d9301a'; c.beginPath(); flamePath(c,x,f.y,R); c.fill();
        c.fillStyle='#fff0a0'; c.beginPath(); flamePath(c,x,f.y,R*0.45); c.fill(); break; }
      case 'leaf':{ const R=f.r*(0.6+0.4*a), co=Math.cos(f.rot), si=Math.sin(f.rot);   // 葉っぱ：とがった だ円＋葉脈
        c.globalAlpha=Math.min(1,a*2); c.fillStyle=f.color; c.beginPath();
        c.moveTo(f.x-co*R,f.y-si*R); c.quadraticCurveTo(f.x+si*R*0.75,f.y-co*R*0.75,f.x+co*R,f.y+si*R); c.quadraticCurveTo(f.x-si*R*0.75,f.y+co*R*0.75,f.x-co*R,f.y-si*R); c.fill();
        c.strokeStyle='#2f8f3a'; c.lineWidth=1.2; c.beginPath(); c.moveTo(f.x-co*R,f.y-si*R); c.lineTo(f.x+co*R,f.y+si*R); c.stroke(); break; }
      case 'plus':{ const R=f.r*(0.7+0.3*a), t=R*0.36;   // 回復の「＋」
        c.globalAlpha=Math.min(1,a*2); c.fillStyle='#35a84a'; c.fillRect(f.x-R-1.2,f.y-t-1.2,R*2+2.4,t*2+2.4); c.fillRect(f.x-t-1.2,f.y-R-1.2,t*2+2.4,R*2+2.4);
        c.fillStyle=f.color; c.fillRect(f.x-R,f.y-t,R*2,t*2); c.fillRect(f.x-t,f.y-R,t*2,R*2); break; }
      default: c.globalAlpha=a; c.fillStyle=f.color; c.beginPath(); c.arc(f.x,f.y,f.r,0,TAU); c.fill();
    }
  }
  c.globalAlpha=1;
  // そざい・レアアイテムを ひろった時の アイコン
  c.font='800 15px '+CANVAS_FONT; c.lineJoin='round';
  for(const q of G.pops){
    const a=clamp(q.t/0.35,0,1), y=q.y-(q.max-q.t)*(q.rare?26:40), s=q.rare?46:26;
    c.globalAlpha=a; c.drawImage(iconCv(q.id),q.x-s/2-(q.rare?0:8),y-s/2,s,s);
    if(!q.rare){ c.strokeStyle=IO; c.lineWidth=4; c.strokeText('+'+q.n,q.x+6,y+6); c.fillStyle='#fff'; c.fillText('+'+q.n,q.x+6,y+6); }
  }
  c.globalAlpha=1;

  drawFog(c,cx,cy);
  c.restore();

  if(G.flash){ c.fillStyle='rgba('+G.flash.c+','+(G.flash.a*clamp(G.flash.t/G.flash.max,0,1)).toFixed(2)+')'; c.fillRect(0,0,VW,VH); }

  if(stick.on&&state==='play'){
    const ox=stick.ox/SC, oy=stick.oy/SC, R=46/SC;
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=2; c.beginPath(); c.arc(ox,oy,R,0,TAU); c.stroke();
    c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.arc(ox+stick.x*R,oy+stick.y*R,R*0.42,0,TAU); c.fill();
  }
}
function drawFog(c,cx,cy){
  const W=CFG.WORLD, m=150, far=1600, col='rgba(196,186,255,', solid=col+'0.92)', clear=col+'0)';
  let g;
  if(cx<m){ g=c.createLinearGradient(0,0,m,0); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(0,-far,m,W+far*2); c.fillStyle=solid; c.fillRect(-far,-far,far,W+far*2); }
  if(cx+VW>W-m){ g=c.createLinearGradient(W,0,W-m,0); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(W-m,-far,m,W+far*2); c.fillStyle=solid; c.fillRect(W,-far,far,W+far*2); }
  if(cy<m){ g=c.createLinearGradient(0,0,0,m); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(-far,0,W+far*2,m); c.fillStyle=solid; c.fillRect(-far,-far,W+far*2,far); }
  if(cy+VH>W-m){ g=c.createLinearGradient(0,W,0,W-m); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(-far,W-m,W+far*2,m); c.fillStyle=solid; c.fillRect(-far,W,W+far*2,far); }
}

/* ---------- HUD ---------- */
const hudCache={};
function setTxt(id,v){ if(hudCache[id]!==v){ hudCache[id]=v; $(id).textContent=v; } }
function setW(id,v){ v=Math.round(v*100)+'%'; if(hudCache[id]!==v){ hudCache[id]=v; $(id).style.width=v; } }
function updateHud(){
  const p=G.p;
  setW('hpfill',clamp(p.hp/p.maxHp,0,1));
  setTxt('hptxt',Math.ceil(p.hp)+' / '+p.maxHp);
  setTxt('time',G.endless?fmtTime(G.t):fmtTime(Math.ceil(G.limit-G.t)));
  if(hudCache.hot!==G.finale){ hudCache.hot=G.finale; $('time').classList.toggle('hot',G.finale); }
  setTxt('lv','Lv '+G.level);
  setW('xpfill',clamp(G.xp/G.need,0,1));
  setTxt('kills',G.kills+' たおした');
  const sk=Object.keys(G.sk).map(id=>'<span class="chip'+(G.sk[id]>=skMax(id)?' max':'')+'">'+SKILLS[id].icon+'<b>'+G.sk[id]+'</b></span>').join('');
  if(hudCache.sk!==sk){ hudCache.sk=sk; $('skills').innerHTML=sk; }
  const g=Math.floor(G.ult/G.ultNeed*100);
  if(hudCache.ult!==g){
    hudCache.ult=g; const b=$('btnUlt'); b.style.setProperty('--g',g); b.classList.toggle('ready',g>=100);
    $('ultfill').style.width=Math.min(100,g)+'%'; $('ultbar').classList.toggle('ready',g>=100);
    $('ulttxt').textContent=g>=100?'★ うてる！ ★':Math.floor(G.ult)+' / '+G.ultNeed;
  }
  const eqk=G.eq?G.eq+'|'+(G.eq==='guard'?(G.guardReady?'ok':Math.ceil(G.guardT)):G.eq==='life'?(G.revived?'x':'ok'):''):'';
  if(hudCache.eq!==eqk){
    hudCache.eq=eqk; const ch=$('eqChip'); ch.classList.toggle('on',!!G.eq);
    if(G.eq){
      const off=(G.eq==='guard'&&!G.guardReady)||(G.eq==='life'&&G.revived);
      ch.classList.toggle('off',off);
      ch.innerHTML=icoImg(G.eq)+(G.eq==='guard'?(G.guardReady?'OK':Math.ceil(G.guardT)+'秒'):G.eq==='life'?(G.revived?'つかった':'1かい'):'');
    }
  }
}

/* ---------- ループ ---------- */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  if(state==='play') tuneQuality((now-last)/1000);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; animT+=dt; lastDt=dt;
  if(state==='play'){
    update(dt);
    if(state==='play'&&G.pending>0) openLevelUp();
    updateHud();
  }
  render();
}

/* ---------- 起動 ---------- */
sndLabel(); resize(); newGame(save.form,save.limit); buildTitle();
window.__norun={ get G(){return G;}, get state(){return state;}, get save(){return save;}, start, pickCard, useUlt, input:dbg, CFG, get Q(){return Q;}, toTitle, toStages, openForge, buildForge, openSheet };   // デバッグ用
requestAnimationFrame(frame);
})();
</script>
