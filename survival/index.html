<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1a2b">
<title>のるんサバイバル（仮）</title>
<style>
:root{
  --ink:#f4f1ff; --sub:#b9b4d6; --panel:rgba(20,22,44,.88); --line:rgba(200,190,255,.28);
  --star:#ffe27a; --pink:#ff8fa8; --violet:#8f74e0;
  --font:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Kosugi Maru","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1a2b;color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
  pointer-events:none;display:none;max-width:720px;margin:0 auto}
#hud.on{display:block}
.row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#hpbar{flex:1;height:18px;border-radius:9px;background:rgba(10,10,25,.7);border:1px solid var(--line);position:relative;overflow:hidden}
#hpfill{position:absolute;inset:0;width:100%;background:linear-gradient(#ffa9bb,#f0668a);border-radius:9px;transition:width .12s}
#hptxt{position:absolute;inset:0;font-size:11px;line-height:17px;text-align:center;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#time{font-size:22px;font-weight:800;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#lv,#kills{font-size:13px;font-weight:700;min-width:44px;text-shadow:0 1px 3px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#kills{text-align:right;min-width:60px}
#xpbar{flex:1;height:8px;border-radius:4px;background:rgba(10,10,25,.7);border:1px solid var(--line);overflow:hidden}
#xpfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe27a,#9fe8ff)}
.hbtn{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,25,.6);
  color:var(--ink);font:700 15px var(--font);padding:0}
#banner{position:fixed;left:0;right:0;top:22%;text-align:center;font-size:22px;font-weight:800;pointer-events:none;opacity:0;
  text-shadow:0 2px 8px #000,0 0 18px var(--violet)}
#banner.go{animation:ban 2.6s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0}}

.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:16px;background:rgba(8,10,24,.62);text-align:center}
.ov.on{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 20px;max-width:440px;width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:30px;letter-spacing:.04em}
h1 small{font-size:14px;color:var(--sub);font-weight:400}
h2{margin:0 0 10px;font-size:24px}
p{margin:8px 0;color:var(--sub);font-size:14px;line-height:1.7}
.big{display:inline-block;margin-top:12px;padding:13px 34px;border-radius:999px;border:0;
  background:linear-gradient(#ffe27a,#f5b94a);color:#3a2a10;font:800 18px var(--font);box-shadow:0 4px 0 #b07a1f}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a1f}
.ghost{display:inline-block;margin:12px 0 0 8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font:700 14px var(--font)}
.best{font-size:13px;color:var(--star)}
table.st{margin:6px auto;border-collapse:collapse;font-size:16px}
table.st td{padding:3px 12px;text-align:left}
table.st td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.new{color:var(--star);font-size:12px;margin-left:6px}

#levelup h2{text-shadow:0 2px 8px #000}
#cards{display:flex;gap:10px;justify-content:center;width:100%;max-width:560px}
.card{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;
  border-radius:18px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--font)}
.card.form{border-color:var(--star);background:linear-gradient(rgba(70,52,120,.95),rgba(24,24,50,.95))}
.card:active{transform:scale(.97)}
.card em{font-style:normal;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--sub)}
.card.form em{background:var(--star);color:#3a2a10;font-weight:800}
.card canvas{width:64px;height:64px}
.card b{font-size:15px}
.card span{font-size:11.5px;line-height:1.5;color:var(--sub)}
@media (max-width:420px){ .card b{font-size:13.5px} .card span{font-size:10.5px} h1{font-size:25px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="row">
    <div id="hpbar"><i id="hpfill"></i><span id="hptxt"></span></div>
    <div id="time">5:00</div>
    <button class="hbtn" id="btnSnd" aria-label="おと">♪</button>
    <button class="hbtn" id="btnPause" aria-label="ポーズ">Ⅱ</button>
  </div>
  <div class="row">
    <span id="lv">Lv 1</span>
    <div id="xpbar"><i id="xpfill"></i></div>
    <span id="kills">0 たおした</span>
  </div>
</div>
<div id="banner"></div>

<div class="ov on" id="title">
  <div class="panel">
    <h1>のるんサバイバル <small>（仮）</small></h1>
    <p>もやもやから にげながら <b id="limTxt">5分</b> いきのこれ！<br>
       こうげきは じどう。星のかけらを ひろうと レベルアップして<br><b>へんしん</b> か <b>つよくなる</b> を えらべるよ。</p>
    <p>そうさ：<b>WASD／やじるし</b>　スマホは <b>がめんを ドラッグ</b></p>
    <p class="best" id="bestTitle"></p>
    <button class="big" id="btnStart">はじめる</button>
  </div>
</div>

<div class="ov" id="levelup">
  <h2>レベルアップ！ どれにする？</h2>
  <div id="cards"></div>
</div>

<div class="ov" id="pause">
  <div class="panel">
    <h2>ひとやすみ</h2>
    <button class="big" id="btnResume">つづける</button>
    <button class="ghost" id="btnQuit">タイトルへ</button>
  </div>
</div>

<div class="ov" id="end">
  <div class="panel">
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <table class="st">
      <tr><td>いきのこった時間</td><td id="eTime"></td></tr>
      <tr><td>たおした数</td><td id="eKills"></td></tr>
      <tr><td>レベル</td><td id="eLv"></td></tr>
    </table>
    <p class="best" id="bestEnd"></p>
    <button class="big" id="btnRetry">もう一度</button>
    <button class="ghost" id="btnToTitle">タイトルへ</button>
  </div>
</div>

<script>
/* ============================================================
   のるんサバイバル（仮） v1
   単体HTML + Canvas / 外部ライブラリなし
   ------------------------------------------------------------
   調整したいときは下の CFG / FORMS / ETYPES / UPGRADES を触る。
   絵を差し替えるときは SPRITES に画像パスを入れる（下に説明）。
   ============================================================ */
(() => {
'use strict';

/* ---------- 調整つまみ ---------- */
const CFG = {
  TIME_LIMIT: 300,          // クリアまでの秒数（3分=180 / 10分=600）
  WORLD: 3200,              // フィールド一辺（px）
  BOSS_TIMES: [150, 240],   // おおもや出現（秒）
  PLAYER_HP: 100,
  MAX_ENEMIES: 240,
  SPAWN_INTERVAL: [1.2, 0.42],  // 出現間隔（開始時→終了時）
  SPAWN_EXTRA: 2.2,             // 終盤に1回で増える数
  ENEMY_HP_GROWTH: 200,         // 小さいほど敵HPが早く増える（HP×(1+t/これ)）
  HEART_RATE: 0.03,             // ハートを落とす確率
  STORAGE_KEY: 'norun-survival-v1',
};

/* 絵の差し替え：ここに画像パスを入れると、その姿は画像で描く（48×48想定・中心が体の中心）。
   null のままなら Canvas で描いた仮の絵。例) normal:'img/norun_normal.png' */
const SPRITES = { normal:null, kurage:null, pan:null, obake:null, penguin:null };

/* へんしん：speed=移動倍率 / grip=大きいほどキビキビ、小さいほど慣性・滑り */
const FORMS = {
  normal:  {name:'のるん',   desc:'星弾を撃つ いつものすがた',            speed:1.00, grip:14,  rate:1.00},
  kurage:  {name:'くらげ',   desc:'ふわり移動。まわりに しびれの輪',       speed:1.05, grip:2.4, rate:1.90},
  pan:     {name:'パン',     desc:'つるっと速い。体当たりが強い',          speed:1.50, grip:1.9, rate:1.50},
  obake:   {name:'おばけ',   desc:'あぶない時 すり抜ける。弾が速い',       speed:1.05, grip:10,  rate:0.85},
  penguin: {name:'ペンギン', desc:'ゆっくり。HP+50、氷弾で敵をおそく',     speed:0.74, grip:10,  rate:1.10},
};
const PENGUIN_HP = 50, OBAKE_PHASE = 2.0, OBAKE_CD = 7.0;

const ETYPES = {
  moya:  {r:15, hp:18,  spd:58,  dmg:8,  xp:1},
  chibi: {r:10, hp:8,   spd:112, dmg:5,  xp:1},
  deka:  {r:26, hp:80,  spd:38,  dmg:14, xp:4},
  boss:  {r:58, hp:900, spd:46,  dmg:22, xp:0, boss:true},
};

const UPGRADES = [
  {id:'dmg',    icon:'💥', title:'こうげきアップ', desc:'ダメージ +25%',        apply:g=>{g.st.dmg*=1.25;}},
  {id:'rate',   icon:'⚡', title:'れんしゃ',       desc:'こうげき間隔 -15%',    max:8, apply:g=>{g.st.interval*=0.85;}},
  {id:'bspd',   icon:'💫', title:'だんそく',       desc:'弾の速さ +20%',        max:5, apply:g=>{g.st.bspd*=1.2;}},
  {id:'move',   icon:'👟', title:'あしのはやさ',   desc:'移動 +10%',            max:6, apply:g=>{g.st.move*=1.10;}},
  {id:'hp',     icon:'💗', title:'げんき',         desc:'最大HP +20、30回復',   apply:g=>{g.p.maxHp+=20; heal(30);}},
  {id:'magnet', icon:'🧲', title:'ひろいじょうず', desc:'かけらを拾う範囲 +40%', max:5, apply:g=>{g.st.magnet*=1.4;}},
  {id:'multi',  icon:'✨', title:'ふやす',         desc:'弾 +1（輪は広がる）',   max:3, apply:g=>{g.st.multi+=1;}},
  {id:'pierce', icon:'🎯', title:'つらぬく',       desc:'弾が敵を +1 貫通',      max:3, apply:g=>{g.st.pierce+=1;}},
  {id:'heal',   icon:'🍪', title:'おやつ',         desc:'HPを 50 回復',          apply:g=>{heal(50);}},
];

/* ---------- 小道具 ---------- */
const TAU = Math.PI*2;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const pick = arr => arr[(Math.random()*arr.length)|0];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const fmtTime = s => { s=Math.max(0,Math.floor(s)); return ((s/60)|0)+':'+String(s%60).padStart(2,'0'); };

/* ---------- 保存 ---------- */
function loadBest(){
  try{ const o=JSON.parse(localStorage.getItem(CFG.STORAGE_KEY)); if(o&&typeof o.time==='number') return o; }catch(e){}
  return {time:0,kills:0,clear:false,mute:false};
}
function saveBest(){ try{ localStorage.setItem(CFG.STORAGE_KEY, JSON.stringify(best)); }catch(e){} }
let best = loadBest();

/* ---------- 効果音（仮：WebAudioの合成音。CC0素材に差し替えるときは SFX の中身を audio 再生に） ---------- */
let AC=null, muted=!!best.mute;
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
let lastPick=0;
const SFX = {
  shoot(){ tone(820,0.05,'triangle',0.02,260); },
  ring(){ tone(300,0.22,'sine',0.05,500); },
  kill(){ tone(260,0.08,'square',0.02,-140); },
  pick(){ const n=performance.now(); if(n-lastPick<50) return; lastPick=n; tone(1250,0.06,'sine',0.03,400); },
  hurt(){ tone(170,0.2,'sawtooth',0.06,-90); },
  heal(){ tone(660,0.1,'sine',0.05); tone(990,0.14,'sine',0.05,0,0.09); },
  level(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.13,'triangle',0.06,0,i*0.07)); },
  form(){ tone(400,0.3,'sine',0.07,900); tone(1200,0.2,'triangle',0.04,0,0.2); },
  phase(){ tone(900,0.3,'sine',0.05,-500); },
  boss(){ tone(110,0.6,'sawtooth',0.07,-40); },
  clear(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.22,'triangle',0.07,0,i*0.12)); },
  over(){ [392,330,262,196].forEach((f,i)=>tone(f,0.25,'triangle',0.06,0,i*0.16)); },
};

/* ---------- 画面 ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let VW=800, VH=600, SC=1, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const w=window.innerWidth, h=window.innerHeight;
  SC = clamp(Math.min(w,h)/520, 0.7, 1.5);
  VW = w/SC; VH = h/SC;
  cv.width = Math.round(w*DPR); cv.height = Math.round(h*DPR);
}
window.addEventListener('resize', resize);

/* ---------- 入力 ---------- */
const keys = {};
const stick = {on:false,id:-1,ox:0,oy:0,x:0,y:0};
const dbg = {x:0,y:0};
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  if(e.repeat) return;
  if(state==='levelup' && ['1','2','3'].includes(k)) pickCard(+k-1);
  else if((k==='p'||k==='escape') && state==='play') pause();
  else if((k==='p'||k==='escape') && state==='pause') resume();
  else if((k==='enter'||k===' ') && state==='title') start();
  else if(k==='enter' && state==='end') start();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

cv.addEventListener('pointerdown', e=>{
  if(state!=='play'||stick.on) return;
  stick.on=true; stick.id=e.pointerId; stick.ox=e.clientX; stick.oy=e.clientY; stick.x=0; stick.y=0;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove', e=>{
  if(!stick.on||e.pointerId!==stick.id) return;
  let dx=(e.clientX-stick.ox)/46, dy=(e.clientY-stick.oy)/46;
  const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  stick.x=dx; stick.y=dy;
});
function stickEnd(e){ if(e && e.pointerId!==stick.id) return; stick.on=false; stick.x=stick.y=0; }
cv.addEventListener('pointerup', stickEnd);
cv.addEventListener('pointercancel', stickEnd);
cv.addEventListener('contextmenu', e=>e.preventDefault());

function getInput(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft']) x-=1;
  if(keys['d']||keys['arrowright']) x+=1;
  if(keys['w']||keys['arrowup']) y-=1;
  if(keys['s']||keys['arrowdown']) y+=1;
  if(x||y){ const m=Math.hypot(x,y); return {x:x/m,y:y/m}; }
  if(stick.on){ const m=Math.hypot(stick.x,stick.y); if(m>0.12) return {x:stick.x,y:stick.y}; }
  if(dbg.x||dbg.y) return {x:dbg.x,y:dbg.y};
  return {x:0,y:0};
}

/* ---------- ゲーム状態 ---------- */
let state='title';   // title | play | levelup | pause | end
let G=null, animT=0, cards=[], cardsReadyAt=0;
const xpNeed = l => Math.floor(4 + l*3 + l*l*0.15);

function newGame(){
  const c=CFG.WORLD/2;
  G = {
    t:0, kills:0, level:1, xp:0, need:xpNeed(1), pending:0, cnt:{},
    p:{x:c,y:c,vx:0,vy:0,hp:CFG.PLAYER_HP,maxHp:CFG.PLAYER_HP,form:'normal',inv:0,fireT:0.4,phase:0,phaseCd:0,dir:1,r:16},
    st:{dmg:10,interval:0.55,bspd:420,move:185,magnet:72,multi:0,pierce:0},
    enemies:[],bullets:[],gems:[],fx:[],rings:[],
    spawnT:0.5,bossIdx:0,shake:0,
  };
}
function heal(n){ const p=G.p; p.hp=Math.min(p.maxHp,p.hp+n); }

function setForm(id){
  const p=G.p; if(p.form===id) return;
  if(p.form==='penguin'){ p.maxHp-=PENGUIN_HP; p.hp=Math.min(p.hp,p.maxHp); }
  if(id==='penguin'){ p.maxHp+=PENGUIN_HP; p.hp+=PENGUIN_HP; }
  p.form=id; p.phase=0; p.phaseCd=0; p.inv=Math.max(p.inv,0.9);
  puff(p.x,p.y,18,'#ffffff'); puff(p.x,p.y,10,'#ffe27a');
  SFX.form();
}

/* ---------- 敵 ---------- */
function addEnemy(type){
  const T=ETYPES[type], p=G.p;
  const a=rand(0,TAU), d=Math.hypot(VW,VH)/2+50+(T.boss?40:0);
  const scale = T.boss ? (G.bossIdx+1) : 1+G.t/CFG.ENEMY_HP_GROWTH;
  const hp=T.hp*scale;
  G.enemies.push({type,boss:!!T.boss,x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:T.r,hp,maxHp:hp,spd:T.spd,dmg:T.dmg,xp:T.xp,
    slow:0,stun:0,flash:0,slamCd:0,kx:0,ky:0,wob:rand(0,TAU),dead:false});
}
function spawn(dt){
  const t=G.t, prog=t/CFG.TIME_LIMIT;
  if(G.bossIdx<CFG.BOSS_TIMES.length && t>=CFG.BOSS_TIMES[G.bossIdx]){
    addEnemy('boss'); G.bossIdx++; banner('おおもや が あらわれた！'); SFX.boss();
  }
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=lerp(CFG.SPAWN_INTERVAL[0],CFG.SPAWN_INTERVAL[1],prog);
    const n=1+Math.floor(prog*CFG.SPAWN_EXTRA+Math.random());
    for(let i=0;i<n && G.enemies.length<CFG.MAX_ENEMIES;i++){
      const r=Math.random(); let type='moya';
      if(t>30 && r<0.2+prog*0.12) type='chibi';
      else if(t>75 && r>0.9-prog*0.1) type='deka';
      addEnemy(type);
    }
  }
}
function hurtEnemy(e,d){
  if(e.dead) return;
  e.hp-=d; e.flash=0.08;
  if(e.hp<=0){ e.dead=true; onKill(e); }
}
function onKill(e){
  G.kills++; SFX.kill();
  puff(e.x,e.y,e.boss?30:6,'#6b4f9c');
  if(e.boss){
    for(let i=0;i<24;i++){ const a=rand(0,TAU), d=rand(10,90); addGem(e.x+Math.cos(a)*d,e.y+Math.sin(a)*d,2,false); }
    addGem(e.x,e.y,0,true); G.shake=0.4;
  }else{
    addGem(e.x,e.y,e.xp,false);
    if(Math.random()<CFG.HEART_RATE) addGem(e.x+10,e.y,0,true);
  }
}
function addGem(x,y,v,heart){
  if(G.gems.length>=380){ const old=G.gems.shift(); if(!old.heart) v+=old.v; }
  G.gems.push({x,y,v,heart,spd:0,ph:rand(0,TAU)});
}

/* ---------- 攻撃 ---------- */
function nearest(maxD){
  const p=G.p; let bestE=null, bd=maxD*maxD;
  for(const e of G.enemies){ const dx=e.x-p.x, dy=e.y-p.y, d=dx*dx+dy*dy-e.r*e.r; if(d<bd){ bd=d; bestE=e; } }
  return bestE;
}
function fire(){
  const p=G.p, st=G.st, f=p.form;
  if(f==='kurage'){
    if(!nearest(210)) return false;
    G.rings.push({x:p.x,y:p.y,r:16,max:125*(1+0.18*st.multi),dmg:st.dmg*1.3,hit:[]});
    SFX.ring(); return true;
  }
  const tgt=nearest(560); if(!tgt) return false;
  const a=Math.atan2(tgt.y-p.y,tgt.x-p.x), n=1+st.multi;
  let spd=st.bspd, dmg=st.dmg, kind='star', r=6;
  if(f==='pan'){ dmg*=0.6; kind='crumb'; r=5; }
  else if(f==='obake'){ spd*=1.7; kind='wisp'; }
  else if(f==='penguin'){ kind='ice'; r=7; }
  for(let i=0;i<n;i++){
    const ang=a+(i-(n-1)/2)*0.17;
    G.bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r,dmg,pierce:st.pierce,life:1.5,kind,hit:[],rot:rand(0,TAU)});
  }
  SFX.shoot(); return true;
}

/* ---------- 更新 ---------- */
function update(dt){
  G.t+=dt;
  if(G.t>=CFG.TIME_LIMIT){ endGame(true); return; }
  updatePlayer(dt);
  spawn(dt);
  updateEnemies(dt);
  if(state!=='play') return;
  updateBullets(dt);
  updateRings(dt);
  updateGems(dt);
  updateFx(dt);
  if(G.shake>0) G.shake-=dt;
}

function updatePlayer(dt){
  const p=G.p, st=G.st, f=FORMS[p.form], inp=getInput();
  const sp=st.move*f.speed, k=Math.min(1,f.grip*dt);
  p.vx+=(inp.x*sp-p.vx)*k; p.vy+=(inp.y*sp-p.vy)*k;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  const lo=40, hi=CFG.WORLD-40;
  if(p.x<lo){p.x=lo;p.vx=0;} else if(p.x>hi){p.x=hi;p.vx=0;}
  if(p.y<lo){p.y=lo;p.vy=0;} else if(p.y>hi){p.y=hi;p.vy=0;}
  if(Math.abs(inp.x)>0.2) p.dir=inp.x>0?1:-1;
  if(p.inv>0) p.inv-=dt;
  if(p.phase>0) p.phase-=dt;
  if(p.phaseCd>0) p.phaseCd-=dt;
  p.fireT-=dt;
  if(p.fireT<=0) p.fireT = fire() ? st.interval*f.rate : 0.1;
}

function updateEnemies(dt){
  const p=G.p, es=G.enemies, pan=p.form==='pan';
  for(const e of es){
    if(e.flash>0) e.flash-=dt;
    if(e.slow>0) e.slow-=dt;
    if(e.slamCd>0) e.slamCd-=dt;
    let dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
    if(d>1500 && !e.boss){ // 置いてけぼりは近くに呼び戻す
      const a=rand(0,TAU), r=Math.hypot(VW,VH)/2+50; e.x=p.x+Math.cos(a)*r; e.y=p.y+Math.sin(a)*r; continue;
    }
    if(e.stun>0) e.stun-=dt;
    else{ const s=e.spd*(e.slow>0?0.5:1)*dt; e.x+=dx/d*s; e.y+=dy/d*s; }
    if(e.kx||e.ky){ e.x+=e.kx*dt; e.y+=e.ky*dt; const dec=Math.max(0,1-6*dt); e.kx*=dec; e.ky*=dec; if(Math.abs(e.kx)+Math.abs(e.ky)<2){e.kx=0;e.ky=0;} }
    // のるんとの接触
    if(d<e.r+p.r*0.8 && p.phase<=0){
      if(pan && e.slamCd<=0){
        e.slamCd=0.35; const kb=e.boss?60:330; e.kx=-dx/d*kb; e.ky=-dy/d*kb;
        hurtEnemy(e,G.st.dmg*3); puff(e.x,e.y,3,'#f6d9a0');
      }
      if(p.inv<=0 && !e.dead){
        if(p.form==='obake' && p.phaseCd<=0){ p.phase=OBAKE_PHASE; p.phaseCd=OBAKE_CD; SFX.phase(); }
        else{
          p.hp-=e.dmg*(pan?0.5:1); p.inv=0.7; G.shake=0.18; SFX.hurt(); puff(p.x,p.y,5,'#ff8fa8');
          if(p.hp<=0){ p.hp=0; endGame(false); return; }
        }
      }
    }
  }
  // 敵どうしの押し合い（重なりすぎ防止）
  const n=es.length;
  for(let i=0;i<n;i++){
    const a=es[i];
    for(let j=i+1;j<n;j++){
      const b=es[j], dx=b.x-a.x, rr=a.r+b.r;
      if(dx>rr||dx<-rr) continue;
      const dy=b.y-a.y; if(dy>rr||dy<-rr) continue;
      const d2=dx*dx+dy*dy; if(d2>=rr*rr||d2===0) continue;
      const d=Math.sqrt(d2), push=(rr-d)*0.25, ux=dx/d, uy=dy/d;
      const wa=a.boss?0:1, wb=b.boss?0:1;
      a.x-=ux*push*wa; a.y-=uy*push*wa; b.x+=ux*push*wb; b.y+=uy*push*wb;
    }
  }
  compact(es, e=>!e.dead);
}

function updateBullets(dt){
  const bs=G.bullets, es=G.enemies;
  for(const b of bs){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; b.rot+=dt*9;
    if(b.life<=0) continue;
    for(const e of es){
      if(e.dead) continue;
      const dx=e.x-b.x, dy=e.y-b.y, rr=e.r+b.r;
      if(dx*dx+dy*dy>rr*rr || b.hit.includes(e)) continue;
      hurtEnemy(e,b.dmg);
      if(b.kind==='ice') e.slow=2.5;
      if(!e.boss){ const m=Math.hypot(b.vx,b.vy)||1; e.kx+=b.vx/m*60; e.ky+=b.vy/m*60; }
      if(b.pierce>0){ b.pierce--; b.hit.push(e); } else { b.life=0; break; }
    }
  }
  compact(bs, b=>b.life>0);
  compact(es, e=>!e.dead);
}

function updateRings(dt){
  for(const r of G.rings){
    r.r+=330*dt;
    for(const e of G.enemies){
      if(e.dead||r.hit.includes(e)) continue;
      const dx=e.x-r.x, dy=e.y-r.y, rr=r.r+e.r;
      if(dx*dx+dy*dy<rr*rr){ r.hit.push(e); e.stun=Math.max(e.stun,e.boss?0.3:0.9); hurtEnemy(e,r.dmg); }
    }
  }
  compact(G.rings, r=>r.r<r.max);
  compact(G.enemies, e=>!e.dead);
}

function updateGems(dt){
  const p=G.p, mag=G.st.magnet;
  for(const g of G.gems){
    const dx=p.x-g.x, dy=p.y-g.y, d=Math.hypot(dx,dy)||1;
    if(d<mag||g.spd>0){ g.spd=Math.min(620,g.spd+1500*dt); g.x+=dx/d*g.spd*dt; g.y+=dy/d*g.spd*dt; }
    if(d<p.r+10){
      g.got=true;
      if(g.heart){ heal(20); SFX.heal(); }
      else{
        SFX.pick(); G.xp+=g.v;
        while(G.xp>=G.need){ G.xp-=G.need; G.level++; G.need=xpNeed(G.level); G.pending++; }
      }
    }
  }
  compact(G.gems, g=>!g.got);
}

function updateFx(dt){
  for(const f of G.fx){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.life-=dt; }
  compact(G.fx, f=>f.life>0);
}
function puff(x,y,n,color){
  if(G.fx.length>260) return;
  for(let i=0;i<n;i++){ const a=rand(0,TAU), s=rand(30,150); G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.25,0.55),max:0.55,r:rand(2,5),color}); }
}
function compact(arr,keep){ let j=0; for(let i=0;i<arr.length;i++){ if(keep(arr[i])) arr[j++]=arr[i]; } arr.length=j; }

/* ---------- レベルアップ ---------- */
function rollCards(){
  const ups=shuffle(UPGRADES.filter(u=>!u.max||(G.cnt[u.id]||0)<u.max));
  const out=[];
  if(G.level<=2||Math.random()<0.6){
    const id=pick(Object.keys(FORMS).filter(f=>f!==G.p.form));
    out.push({kind:'form',id,title:FORMS[id].name,desc:FORMS[id].desc});
  }
  while(out.length<3 && ups.length){ const u=ups.pop(); out.push({kind:'up',u,title:u.title,desc:u.desc}); }
  return shuffle(out);
}
function openLevelUp(){
  state='levelup'; stickEnd(); cards=rollCards(); cardsReadyAt=performance.now()+280;
  const box=$('cards'); box.innerHTML='';
  cards.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='card'+(c.kind==='form'?' form':'');
    const tag=document.createElement('em'); tag.textContent=c.kind==='form'?'へんしん':'つよくなる';
    const ic=document.createElement('canvas'); ic.width=128; ic.height=128; drawCardIcon(ic,c);
    const h=document.createElement('b'); h.textContent=c.title;
    const d=document.createElement('span'); d.textContent=c.desc;
    b.append(tag,ic,h,d); b.onclick=()=>pickCard(i); box.appendChild(b);
  });
  $('levelup').classList.add('on'); SFX.level();
}
function drawCardIcon(ic,c){
  const g=ic.getContext('2d');
  if(c.kind==='form'){ g.save(); g.scale(2.3,2.3); g.translate(27.8,32); drawNorun(g,c.id,0,1,false); g.restore(); }
  else{ g.font='72px serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(c.u.icon,64,70); }
}
function pickCard(i){
  if(state!=='levelup'||performance.now()<cardsReadyAt) return;
  const c=cards[i]; if(!c) return;
  if(c.kind==='form') setForm(c.id);
  else{ c.u.apply(G); G.cnt[c.u.id]=(G.cnt[c.u.id]||0)+1; }
  G.pending--; G.p.inv=Math.max(G.p.inv,0.6);
  if(G.pending>0) openLevelUp();
  else{ $('levelup').classList.remove('on'); state='play'; }
}

/* ---------- 画面遷移 ---------- */
function showOnly(id){ for(const k of ['title','levelup','pause','end']) $(k).classList.toggle('on',k===id); }
function bestText(){
  if(!best.time) return '';
  return 'ベスト： '+fmtTime(best.time)+(best.clear?'（クリア！）':'')+' ／ '+best.kills+' たおした';
}
function start(){
  initAudio(); newGame(); state='play'; showOnly(null); $('hud').classList.add('on');
}
function toTitle(){
  newGame(); state='title'; $('hud').classList.remove('on'); $('bestTitle').textContent=bestText(); showOnly('title');
}
function pause(){ if(state!=='play') return; state='pause'; stickEnd(); showOnly('pause'); }
function resume(){ if(state!=='pause') return; state='play'; showOnly(null); }
function endGame(clear){
  state='end'; stickEnd();
  const time=clear?CFG.TIME_LIMIT:G.t;
  const newT=time>best.time, newK=G.kills>best.kills;
  if(newT) best.time=time; if(newK) best.kills=G.kills; if(clear) best.clear=true;
  saveBest();
  $('endTitle').textContent=clear?'🌟 クリア！':'やられちゃった…';
  $('endMsg').textContent=clear?'もやもやの夜を いきのこった！':'もういちど ちょうせんしてみよう';
  $('eTime').innerHTML=fmtTime(time)+(newT?'<span class="new">NEW</span>':'');
  $('eKills').innerHTML=G.kills+(newK?'<span class="new">NEW</span>':'');
  $('eLv').textContent=G.level;
  $('bestEnd').textContent=bestText();
  showOnly('end');
  if(clear) SFX.clear(); else SFX.over();
}
function banner(txt){ const b=$('banner'); b.textContent=txt; b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }

$('btnStart').onclick=start;
$('btnRetry').onclick=start;
$('btnToTitle').onclick=toTitle;
$('btnQuit').onclick=toTitle;
$('btnResume').onclick=resume;
$('btnPause').onclick=pause;
function sndLabel(){ $('btnSnd').textContent=muted?'×':'♪'; }
$('btnSnd').onclick=()=>{ muted=!muted; best.mute=muted; saveBest(); sndLabel(); };

/* ---------- のるんの絵（仮：Canvas描画） ----------
   正本ルール：変身中は帽子なし／顔（眠そうな半目・小さい口・舌）は全姿共通／ペンギンにくちばし無し */
const spriteImg={};
for(const k in SPRITES){ if(SPRITES[k]){ const im=new Image(); im.src=SPRITES[k]; spriteImg[k]=im; } }

function drawFace(c,y){
  c.fillStyle='#3b3352';
  for(const s of [-1,1]){
    c.beginPath(); c.arc(s*6.2,y,3.1,0,Math.PI); c.closePath(); c.fill();   // 半目
    c.fillRect(s*6.2-3.9,y-0.9,7.8,1.6);                                    // まぶた
  }
  c.strokeStyle='#3b3352'; c.lineWidth=1.3; c.lineCap='round';
  c.beginPath(); c.moveTo(-2.3,y+5.4); c.lineTo(2.3,y+5.4); c.stroke();     // 小さい口
  c.fillStyle='#ff8fa8'; c.beginPath(); c.arc(0.5,y+5.9,1.9,0,Math.PI); c.closePath(); c.fill(); // 舌
}
function drawNorun(c,form,t,dir,phasing){
  const img=spriteImg[form];
  if(img && img.complete && img.naturalWidth){ c.save(); c.scale(dir,1); c.drawImage(img,-24,-28,48,48); c.restore(); return; }
  const bob=Math.sin(t*5)*1.2;
  c.save(); c.translate(0,bob);
  if(form==='normal'){
    c.fillStyle='#fffdf7';
    c.beginPath(); c.arc(0,0,15.5,0,TAU); c.fill();
    for(let i=0;i<10;i++){ const a=i/10*TAU+Math.sin(t*2+i)*0.06; c.beginPath(); c.arc(Math.cos(a)*13.2,Math.sin(a)*13.2,6.2,0,TAU); c.fill(); }
    drawFace(c,0);
    c.fillStyle='#1c1826';                                    // 黒い魔女帽子
    c.beginPath(); c.ellipse(0,-14.5,17.5,4.8,-0.1,0,TAU); c.fill();
    c.beginPath(); c.moveTo(-10,-15.5); c.quadraticCurveTo(-4,-30,7*dir,-40); c.quadraticCurveTo(6,-26,10,-17); c.closePath(); c.fill();
    c.strokeStyle='#8f74e0'; c.lineWidth=2.4; c.beginPath(); c.moveTo(-9.4,-17.6); c.quadraticCurveTo(0,-15.2,9.6,-19); c.stroke();
  }else if(form==='kurage'){
    c.strokeStyle='#cfe6ff'; c.lineWidth=2.2; c.lineCap='round';
    for(let i=-2;i<=2;i++){ const x=i*5.5, w=Math.sin(t*4+i)*2.5; c.beginPath(); c.moveTo(x,8); c.quadraticCurveTo(x+w,15,x-w,22); c.stroke(); }
    c.fillStyle='#f4f9ff';
    c.beginPath(); c.moveTo(-17,6); c.bezierCurveTo(-18,-22,18,-22,17,6);
    for(let i=0;i<4;i++){ const x0=17-i*8.5; c.quadraticCurveTo(x0-4.25,11,x0-8.5,6); }
    c.closePath(); c.fill();
    c.fillStyle='rgba(159,216,255,.35)'; c.beginPath(); c.ellipse(-7,-9,4,2.4,-0.6,0,TAU); c.fill();
    drawFace(c,-3);
  }else if(form==='pan'){
    c.fillStyle='#d99a4e'; rr(c,-18,-11,36,25,9); c.fill();
    c.fillStyle='#f3cf8e'; rr(c,-16,-13,32,21,9); c.fill();
    c.strokeStyle='#d99a4e'; c.lineWidth=1.5; c.lineCap='round';
    for(const x of [-9,0,9]){ c.beginPath(); c.moveTo(x-2,-11); c.lineTo(x+2,-8); c.stroke(); }
    drawFace(c,-2);
  }else if(form==='obake'){
    c.globalAlpha*=phasing?0.45:0.9;
    c.fillStyle='#f7f4ff';
    c.beginPath(); c.moveTo(-15,14); c.lineTo(-15,-3); c.arc(0,-3,15,Math.PI,0); c.lineTo(15,14);
    for(let i=0;i<3;i++){ const x0=15-i*10, w=Math.sin(t*6+i)*1.5; c.quadraticCurveTo(x0-5,8+w,x0-10,14); }
    c.closePath(); c.fill();
    drawFace(c,-3);
  }else if(form==='penguin'){
    c.fillStyle='#f5a94a'; c.beginPath(); c.ellipse(-6,18,5,2.6,0,0,TAU); c.ellipse(6,18,5,2.6,0,0,TAU); c.fill();
    c.fillStyle='#2b3a67';
    const fl=Math.sin(t*6)*0.25;
    c.save(); c.translate(-15,2); c.rotate(0.5+fl); c.beginPath(); c.ellipse(0,0,4,9,0,0,TAU); c.fill(); c.restore();
    c.save(); c.translate(15,2); c.rotate(-0.5-fl); c.beginPath(); c.ellipse(0,0,4,9,0,0,TAU); c.fill(); c.restore();
    c.beginPath(); c.ellipse(0,0,16,18.5,0,0,TAU); c.fill();
    c.fillStyle='#fffdf7'; c.beginPath(); c.ellipse(0,3,12,14,0,0,TAU); c.fill();
    drawFace(c,-2);                                           // くちばしは描かない（口と舌）
  }
  c.restore();
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function starPath(c,x,y,r,rot){
  c.beginPath();
  for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4, rad=i%2?r*0.42:r; c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad); }
  c.closePath();
}

/* ---------- 描画 ---------- */
function hash(x,y){ let h=(x*374761393+y*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }

function render(){
  const c=ctx, p=G.p;
  c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  let cx=p.x-VW/2, cy=p.y-VH/2;
  if(G.shake>0){ cx+=rand(-4,4); cy+=rand(-4,4); }
  c.fillStyle='#12263a'; c.fillRect(0,0,VW,VH);
  c.save(); c.translate(-cx,-cy);

  // 星空の草原
  const T=160, x0=Math.floor(cx/T), y0=Math.floor(cy/T), x1=Math.floor((cx+VW)/T), y1=Math.floor((cy+VH)/T);
  c.lineCap='round';
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const bx=tx*T, by=ty*T;
    c.strokeStyle='#1f4d4f'; c.lineWidth=2;
    for(let i=0;i<3;i++){
      const gx=bx+hash(tx*7+i,ty)*T, gy=by+hash(tx,ty*7+i)*T;
      c.beginPath(); c.moveTo(gx-4,gy); c.lineTo(gx-6,gy-7); c.moveTo(gx,gy); c.lineTo(gx,gy-9); c.moveTo(gx+4,gy); c.lineTo(gx+6,gy-7); c.stroke();
    }
    for(let i=0;i<2;i++){
      const sx=bx+hash(tx*13+i,ty+5)*T, sy=by+hash(tx+9,ty*13+i)*T, tw=0.35+0.3*Math.sin(animT*1.7+hash(tx+i,ty)*40);
      c.fillStyle='rgba(255,236,170,'+tw.toFixed(2)+')'; starPath(c,sx,sy,3.2,0); c.fill();
    }
  }

  // かけら・ハート
  for(const g of G.gems){
    const y=g.y+Math.sin(animT*4+g.ph)*2;
    if(g.heart){ c.fillStyle='#ff8fa8'; c.beginPath(); c.arc(g.x-3,y-2,4,0,TAU); c.arc(g.x+3,y-2,4,0,TAU); c.fill();
      c.beginPath(); c.moveTo(g.x-7,y-0.5); c.lineTo(g.x,y+8); c.lineTo(g.x+7,y-0.5); c.closePath(); c.fill(); }
    else{ c.fillStyle=g.v>1?'#9fe8ff':'#ffe27a'; starPath(c,g.x,y,g.v>1?7:5.5,animT*2+g.ph); c.fill(); }
  }

  // しびれの輪
  for(const r of G.rings){
    const a=1-r.r/r.max;
    c.strokeStyle='rgba(159,232,255,'+(0.25+a*0.6).toFixed(2)+')'; c.lineWidth=5;
    c.beginPath(); c.arc(r.x,r.y,r.r,0,TAU); c.stroke();
    c.fillStyle='rgba(159,232,255,'+(a*0.12).toFixed(2)+')'; c.fill();
  }

  // もやもや
  for(const e of G.enemies){
    const r=e.r, w=Math.sin(animT*3+e.wob)*r*0.09;
    c.fillStyle=e.flash>0?'#ffffff':e.slow>0?'#3f5a8f':e.boss?'#33204f':'#44306a';
    c.globalAlpha=0.93;
    c.beginPath();
    c.arc(e.x,e.y,r,0,TAU);
    c.moveTo(e.x-r*0.6+r*0.62,e.y+r*0.35+w); c.arc(e.x-r*0.6,e.y+r*0.35+w,r*0.62,0,TAU);
    c.moveTo(e.x+r*0.6+r*0.62,e.y+r*0.35-w); c.arc(e.x+r*0.6,e.y+r*0.35-w,r*0.62,0,TAU);
    c.moveTo(e.x+r*0.6,e.y-r*0.5-w); c.arc(e.x,e.y-r*0.5-w,r*0.6,0,TAU);
    c.fill();
    c.globalAlpha=1;
    c.strokeStyle='rgba(200,170,255,.45)'; c.lineWidth=1.5; c.beginPath(); c.arc(e.x,e.y,r,0,TAU); c.stroke();
    c.fillStyle=e.stun>0?'#9fe8ff':'#ffe9a8';
    c.beginPath(); c.ellipse(e.x-r*0.32,e.y-r*0.05,r*0.14,r*0.2,0,0,TAU); c.ellipse(e.x+r*0.32,e.y-r*0.05,r*0.14,r*0.2,0,0,TAU); c.fill();
    if(e.boss){
      const bw=r*1.6; c.fillStyle='rgba(10,10,25,.7)'; c.fillRect(e.x-bw/2,e.y-r-18,bw,6);
      c.fillStyle='#c79bff'; c.fillRect(e.x-bw/2,e.y-r-18,bw*clamp(e.hp/e.maxHp,0,1),6);
    }
  }

  // 弾
  for(const b of G.bullets){
    if(b.kind==='star'){ c.fillStyle='#ffe27a'; starPath(c,b.x,b.y,b.r+2,b.rot); c.fill(); }
    else if(b.kind==='ice'){ c.fillStyle='#bfefff'; starPath(c,b.x,b.y,b.r+2,Math.PI/8); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(b.x,b.y,2.5,0,TAU); c.fill(); }
    else if(b.kind==='wisp'){ c.fillStyle='rgba(220,205,255,.95)'; c.beginPath(); c.arc(b.x,b.y,b.r,0,TAU); c.fill();
      c.fillStyle='rgba(220,205,255,.4)'; c.beginPath(); c.arc(b.x-b.vx*0.02,b.y-b.vy*0.02,b.r*0.8,0,TAU); c.fill(); }
    else{ c.fillStyle='#f3cf8e'; c.beginPath(); c.arc(b.x,b.y,b.r,0,TAU); c.fill(); }
  }

  // のるん
  c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(p.x,p.y+19,14,4.5,0,0,TAU); c.fill();
  if(p.form==='obake' && p.phaseCd>0 && p.phase<=0){
    c.strokeStyle='rgba(220,205,255,.6)'; c.lineWidth=2.5;
    c.beginPath(); c.arc(p.x,p.y+19,18,-Math.PI/2,-Math.PI/2+TAU*(1-p.phaseCd/OBAKE_CD)); c.stroke();
  }
  c.save(); c.translate(p.x,p.y);
  if(p.inv>0 && p.phase<=0 && Math.floor(animT*18)%2) c.globalAlpha=0.45;
  const moving=state==='play'&&(Math.abs(p.vx)+Math.abs(p.vy)>20);
  drawNorun(c,p.form,moving?animT*1.6:animT*0.6,p.dir,p.phase>0);
  c.restore();

  // きらきら
  for(const f of G.fx){ c.globalAlpha=clamp(f.life/f.max,0,1); c.fillStyle=f.color; c.beginPath(); c.arc(f.x,f.y,f.r,0,TAU); c.fill(); }
  c.globalAlpha=1;

  drawFog(c,cx,cy);
  c.restore();

  // バーチャルスティック
  if(stick.on && state==='play'){
    const ox=stick.ox/SC, oy=stick.oy/SC, R=46/SC;
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=2; c.beginPath(); c.arc(ox,oy,R,0,TAU); c.stroke();
    c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.arc(ox+stick.x*R,oy+stick.y*R,R*0.42,0,TAU); c.fill();
  }
}

function drawFog(c,cx,cy){   // フィールドの端＝星の霧
  const W=CFG.WORLD, m=150, far=1600, col='rgba(196,186,255,', solid=col+'0.92)', clear=col+'0)';
  let g;
  if(cx<m){ g=c.createLinearGradient(0,0,m,0); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(0,-far,m,W+far*2); c.fillStyle=solid; c.fillRect(-far,-far,far,W+far*2); }
  if(cx+VW>W-m){ g=c.createLinearGradient(W,0,W-m,0); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(W-m,-far,m,W+far*2); c.fillStyle=solid; c.fillRect(W,-far,far,W+far*2); }
  if(cy<m){ g=c.createLinearGradient(0,0,0,m); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(-far,0,W+far*2,m); c.fillStyle=solid; c.fillRect(-far,-far,W+far*2,far); }
  if(cy+VH>W-m){ g=c.createLinearGradient(0,W,0,W-m); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(-far,W-m,W+far*2,m); c.fillStyle=solid; c.fillRect(-far,W,W+far*2,far); }
}

/* ---------- HUD ---------- */
const hudCache={};
function setTxt(id,v){ if(hudCache[id]!==v){ hudCache[id]=v; $(id).textContent=v; } }
function setW(id,v){ v=Math.round(v*100)+'%'; if(hudCache[id]!==v){ hudCache[id]=v; $(id).style.width=v; } }
function updateHud(){
  const p=G.p;
  setW('hpfill',clamp(p.hp/p.maxHp,0,1));
  setTxt('hptxt',Math.ceil(p.hp)+' / '+p.maxHp);
  setTxt('time',fmtTime(Math.ceil(CFG.TIME_LIMIT-G.t)));
  setTxt('lv','Lv '+G.level);
  setW('xpfill',clamp(G.xp/G.need,0,1));
  setTxt('kills',G.kills+' たおした');
}

/* ---------- ループ ---------- */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; animT+=dt;
  if(state==='play'){
    update(dt);
    if(state==='play' && G.pending>0) openLevelUp();
    updateHud();
  }
  render();
}

/* ---------- 起動 ---------- */
const mins=CFG.TIME_LIMIT/60;
$('limTxt').textContent=(Number.isInteger(mins)?mins:mins.toFixed(1))+'分';
$('bestTitle').textContent=bestText();
sndLabel(); resize(); newGame();
window.__norun={ get G(){return G;}, get state(){return state;}, start, pickCard, input:dbg, CFG };   // デバッグ用
requestAnimationFrame(frame);
})();
</script>
