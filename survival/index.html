<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1a2b">
<title>のるんサバイバル（仮）</title>
<style>
:root{
  --ink:#f4f1ff; --sub:#b9b4d6; --panel:rgba(20,22,44,.9); --line:rgba(200,190,255,.28);
  --star:#ffe27a; --pink:#ff8fa8; --violet:#8f74e0;
  --font:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Kosugi Maru","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1a2b;color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font);color:var(--ink)}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
  pointer-events:none;display:none;max-width:720px;margin:0 auto}
#hud.on{display:block}
.row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#hpbar{flex:1;height:18px;border-radius:9px;background:rgba(10,10,25,.7);border:1px solid var(--line);position:relative;overflow:hidden}
#hpfill{position:absolute;inset:0;width:100%;background:linear-gradient(#ffa9bb,#f0668a);border-radius:9px;transition:width .12s}
#hptxt{position:absolute;inset:0;font-size:11px;line-height:17px;text-align:center;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#time{font-size:22px;font-weight:800;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#time.hot{color:var(--pink)}
#lv,#kills{font-size:13px;font-weight:700;min-width:44px;text-shadow:0 1px 3px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#kills{text-align:right;min-width:60px}
#xpbar{flex:1;height:8px;border-radius:4px;background:rgba(10,10,25,.7);border:1px solid var(--line);overflow:hidden}
#xpfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe27a,#9fe8ff)}
#skills{font-size:13px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8);letter-spacing:.02em;line-height:1.5}
.hbtn{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,25,.6);font-weight:700;font-size:15px;padding:0}
#btnUlt{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
  width:84px;height:84px;border-radius:50%;border:0;padding:0;display:none;
  background:conic-gradient(var(--star) calc(var(--g,0)*1%),rgba(10,10,25,.75) 0);opacity:.75}
#btnUlt.on{display:block}
#btnUlt span{position:absolute;inset:6px;border-radius:50%;background:#1b1d3a;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:var(--sub)}
#btnUlt.ready{opacity:1;animation:pulse .8s ease-in-out infinite alternate;box-shadow:0 0 22px var(--star)}
#btnUlt.ready span{background:linear-gradient(#ffe27a,#f5b94a);color:#3a2a10}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.09)}}
#banner{position:fixed;left:0;right:0;top:22%;text-align:center;font-size:22px;font-weight:800;pointer-events:none;opacity:0;
  text-shadow:0 2px 8px #000,0 0 18px var(--violet)}
#banner.go{animation:ban 2.2s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0}}

.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:12px;background:rgba(8,10,24,.62);text-align:center}
.ov.on{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px;max-width:460px;width:100%;
  max-height:100%;overflow-y:auto;touch-action:pan-y;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{margin:0 0 2px;font-size:26px;letter-spacing:.04em}
h1 small{font-size:13px;color:var(--sub);font-weight:400}
h2{margin:0 0 10px;font-size:23px}
p{margin:6px 0;color:var(--sub);font-size:13px;line-height:1.65}
.big{display:inline-block;margin-top:10px;padding:13px 34px;border-radius:999px;border:0;
  background:linear-gradient(#ffe27a,#f5b94a);color:#3a2a10;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b07a1f}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a1f}
.ghost{display:inline-block;margin:10px 0 0 8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-weight:700;font-size:14px}
.best{font-size:13px;color:var(--star)}
#forms{display:flex;gap:6px;justify-content:center;margin:10px 0 6px}
.fbtn{flex:1;min-width:0;padding:4px 0 6px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.05);
  font-size:11px;font-weight:700;position:relative}
.fbtn canvas{width:48px;height:48px;display:block;margin:0 auto}
.fbtn.sel{border-color:var(--star);background:rgba(255,226,122,.16)}
.fbtn.lock canvas{opacity:.28}
.fbtn.lock::after{content:"🔒";position:absolute;left:0;right:0;top:14px;font-size:20px}
#formInfo{min-height:58px;font-size:12.5px;line-height:1.6;color:var(--ink);background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
#formInfo i{font-style:normal;color:var(--sub)}
#limits{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}
.lbtn{padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:14px}
.lbtn.sel{border-color:var(--star);background:rgba(255,226,122,.16)}
table.st{margin:6px auto;border-collapse:collapse;font-size:16px}
table.st td{padding:3px 12px;text-align:left}
table.st td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.new{color:var(--star);font-size:12px;margin-left:6px}
#unlockMsg{color:var(--star);font-weight:800;font-size:14px}

#levelup h2{text-shadow:0 2px 8px #000}
#cards{display:flex;gap:10px;justify-content:center;width:100%;max-width:560px}
.card{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px 12px;
  border-radius:18px;border:2px solid var(--line);background:var(--panel)}
.card.newsk{border-color:var(--star);background:linear-gradient(rgba(70,52,120,.95),rgba(24,24,50,.95))}
.card:active{transform:scale(.97)}
.card em{font-style:normal;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--sub)}
.card.newsk em{background:var(--star);color:#3a2a10;font-weight:800}
.card .ic{font-size:40px;line-height:1.25}
.card b{font-size:15px}
.card span.d{font-size:11.5px;line-height:1.5;color:var(--sub)}
@media (max-width:420px){ .card b{font-size:13.5px} .card span.d{font-size:10.5px} h1{font-size:23px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="row">
    <div id="hpbar"><i id="hpfill"></i><span id="hptxt"></span></div>
    <div id="time">3:00</div>
    <button class="hbtn" id="btnSnd" aria-label="おと">♪</button>
    <button class="hbtn" id="btnPause" aria-label="ポーズ">Ⅱ</button>
  </div>
  <div class="row">
    <span id="lv">Lv 1</span>
    <div id="xpbar"><i id="xpfill"></i></div>
    <span id="kills">0 たおした</span>
  </div>
  <div id="skills"></div>
</div>
<button id="btnUlt" aria-label="大技"><span>大技</span></button>
<div id="banner"></div>

<div class="ov on" id="title">
  <div class="panel">
    <h1>のるんサバイバル <small>（仮）</small></h1>
    <p>地球の いきものたちから にげきれ！ こうげきは じどう。<br>星のかけらで レベルアップ → <b>スキル</b>を えらぶ。たおすと <b>大技</b>ゲージが たまる。</p>
    <div id="forms"></div>
    <div id="formInfo"></div>
    <div id="limits">じかん <button class="lbtn" data-l="180">3分</button><button class="lbtn" data-l="300">5分</button></div>
    <p class="best" id="bestTitle"></p>
    <button class="big" id="btnStart">はじめる</button>
    <p>そうさ：WASD／やじるし・大技は スペース　｜　スマホ：ドラッグ・右下ボタン</p>
  </div>
</div>

<div class="ov" id="levelup">
  <h2>レベルアップ！ スキルを えらぼう</h2>
  <div id="cards"></div>
</div>

<div class="ov" id="pause">
  <div class="panel">
    <h2>ひとやすみ</h2>
    <button class="big" id="btnResume">つづける</button>
    <button class="ghost" id="btnQuit">タイトルへ</button>
  </div>
</div>

<div class="ov" id="end">
  <div class="panel">
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <table class="st">
      <tr><td>いきのこった時間</td><td id="eTime"></td></tr>
      <tr><td>たおした数</td><td id="eKills"></td></tr>
      <tr><td>レベル</td><td id="eLv"></td></tr>
    </table>
    <p id="unlockMsg"></p>
    <p class="best" id="bestEnd"></p>
    <button class="big" id="btnRetry">もう一度</button>
    <button class="ghost" id="btnToTitle">タイトルへ</button>
  </div>
</div>

<script>
/* ============================================================
   のるんサバイバル（仮） v4
   単体HTML + Canvas / 外部ライブラリなし
   ------------------------------------------------------------
   調整は下の CFG / FORMS / SKILLS / ETYPES。
   のるんの絵は SPRITES、敵の絵は ENEMY_SPRITES に画像パス（ファイルが無ければ仮絵で動く）。
   テスト用：URLの末尾に ?unlock=1 を付けると全へんしんが一時的に使える（保存はされない）。
   ============================================================ */
(() => {
'use strict';

/* ---------- 調整つまみ ---------- */
const CFG = {
  LIMITS: [180, 300],       // タイトルで選べる制限時間（秒）。ここに 600 などを足せば選択肢が増える
  DEFAULT_LIMIT: 180,
  WORLD: 3200,
  BOSSES: [{at:0.5,type:'bosscat'},{at:0.8,type:'bosscrow'}],   // ボス登場（制限時間に対する割合）
  HAND_AT: 20,              // 残りこの秒数で「手」が来る（倒さなくても逃げ切ればクリア）
  HAND_WARN: 0.9,           // 手が降ってくる前の予告時間（秒）
  ANT_MAX: 10,              // アリの同時出現上限
  ANT_INTERVAL: [7, 4],     // アリの行列が来る間隔（開始時→終了時）
  CROW_MAX: 8,              // カラスの同時出現上限
  CROW_DIVE: 520,           // カラスの急降下の速さ
  DOG_RUSH: 240,            // いぬの突進の速さ
  TILT_MAX: 10,             // のるんが移動方向へ傾く最大角度（度）
  SPRITE_H: 50,             // のるんのPNGを描く高さ（当たり判定の半径は16）
  SPRITE_DY: -3,            // のるんのPNGの上下位置の微調整
  PLAYER_HP: 100,
  MAX_ENEMIES: 240,
  SPAWN_INTERVAL: [1.1, 0.36],  // 出現間隔（開始時→終了時）
  SPAWN_EXTRA: 2.6,             // 終盤に1回で増える数
  ENEMY_HP_GROWTH: 2.4,     // 終了時の敵HP = 開始時 ×(1+これ)
  ENEMY_SPD_GROWTH: 0.2,    // 終了時の敵の速さ = 開始時 ×(1+これ)
  ENEMY_DMG_GROWTH: 0.5,    // 終了時の敵の攻撃 = 開始時 ×(1+これ)
  FINALE: 30,               // 残りこの秒数から「さいごのラッシュ」
  FINALE_SPAWN: 0.5,        // ラッシュ中の出現間隔の倍率（小さいほど多い）
  FINALE_HP: 1.35,          // ラッシュ中に湧く敵のHP倍率
  FINALE_MAX: 300,          // ラッシュ中の同時出現上限
  BOSS_REWARD: {level:true, ult:true},   // ボス撃破のごほうび（レベルアップ確定／大技ゲージ満タン）
  BONUS_FROM_LV: 3,         // このLv以上のスキルが1つでもできたら、3択にボーナス枠が混ざり始める
  BONUS_RATE: 0.3,          // 混ざる確率
  HERB_LIFE: 10,            // 回復エリアの寿命（秒）
  HERB_SHRINK: 5,           // 敵1体が踏んでいる間に縮む速さ（px/秒）
  HERB_SHRINK_MAX: 45,      // 縮む速さの上限
  HEART_RATE: 0.03,
  ULT_NEED: 60,             // 大技に必要な討伐数（ボスは10体ぶん）
  ULT_STEP: 15,             // 大技を使うたびに必要数がこれだけ増える
  SKILL_MAX: 5,
  SAVE_KEY: 'norun-survival-v2',
};

/* のるんの絵（透過PNG・正面向き1枚）。この名前で index.html と同じ場所の img/ に置く。無ければ仮絵。 */
const SPRITES = { normal:'img/norun_normal.png', kurage:'img/norun_kurage.png', pan:'img/norun_pan.png',
                  obake:'img/norun_obake.png', penguin:'img/norun_penguin.png' };
/* 敵の絵。いまは全部 null（＝Canvasで描いた仮絵）。差し替える時は 'img/enemy_cat.png' のようにパスを入れる。
   右向き（または正面）の透過PNGを想定。左へ進む時は自動で反転する。 */
const ENEMY_SPRITES = { ant:null, bee:null, cat:null, crow:null, dog:null, bosscat:null, bosscrow:null, hand:null };

/* へんしん：speed=移動倍率 / grip=小さいほど慣性・滑り / aff=最初のレベルアップで必ず出るスキル */
const FORMS = {
  normal:  {name:'のるん',   speed:1.00, grip:14,  aff:null,      perk:'かけらを ひろえる はんいが ひろい',        ult:'星のシャワー',        ultDesc:'がめん全体に 星がふる'},
  kurage:  {name:'くらげ',   speed:1.05, grip:2.4, aff:'thunder', perk:'かみなりの 感電が ひろく・ながい',        ult:'大ほうでん',          ultDesc:'まわり全部を しびれさせる'},
  pan:     {name:'パン',     speed:1.35, grip:1.9, aff:'move',    perk:'はやく うごくほど こうげきが つよい',      ult:'きょだいパンとっしん', ultDesc:'大きくなって むてきで体当たり'},
  obake:   {name:'おばけ',   speed:1.05, grip:10,  aff:'poison',  perk:'どくが つよく・ながい。あぶない時 すりぬけ', ult:'すりぬけ どくぎり',   ultDesc:'しばらく完全すりぬけ＋全体に どく'},
  penguin: {name:'ペンギン', speed:0.80, grip:10,  aff:'halo',    perk:'HPが たかい。ビームの輪が ふとい',         ult:'ブリザード',          ultDesc:'がめん全体を こおらせる'},
};
const PERK = { normalMagnet:1.8, kurageChain:1.6, kurageStun:2.0, panPerSpeed:0.6, panCap:1.5,
               obakePoison:1.7, obakePoisonDur:6, obakePhase:2.0, obakeCd:7.0, penguinHp:60, penguinHalo:1.8 };

/* 解放条件 */
const UNLOCK = {
  normal:  {ok:()=>true},
  kurage:  {ok:()=>true},
  pan:     {ok:s=>!!s.anyClear,              how:()=>'どれかの姿で 1回クリア'},
  obake:   {ok:s=>s.totalKills>=500,         how:s=>'いきものを 合計500体たおす（いま '+s.totalKills+'体）'},
  penguin: {ok:s=>(s.clears.kurage||0)>=1,   how:()=>'くらげで 1回クリア'},
};

/* スキル：同じものを重ねて取るとレベルアップ（最大 SKILL_MAX）。数値は skill*() 関数内 */
const SKILLS = {
  shot:    {icon:'⭐', name:'星弾',       desc:'近い敵に 星をうつ',
            ups:{2:'弾が 2つに ふえる',3:'敵を 1体 つらぬく',4:'あたると 2つに ぶんれつ',5:'弾3つ・ぶんれつも 3つ'}},
  orbit:   {icon:'🪐', name:'まわる星',   desc:'まわりを 星が ぐるぐる',          up:'星の数とダメージ↑'},
  halo:    {icon:'⭕', name:'ビームの輪', desc:'輪っかに ふれた敵に ダメージ',    up:'輪が太く・つよく'},
  homing:  {icon:'🎯', name:'おいかけ弾', desc:'敵を おいかける弾',               up:'弾の数とダメージ↑'},
  fire:    {icon:'🔥', name:'ほのお',     desc:'地面がもえて 敵を やけどに',      up:'炎が広く・つよく'},
  thunder: {icon:'⚡', name:'かみなり',   desc:'敵から敵へ つたわり しびれさせる', up:'つたわる数とダメージ↑'},
  poison:  {icon:'🍄', name:'どく',       desc:'弾があたると じわじわダメージ',   up:'どくが つよく'},
  ice:     {icon:'❄️', name:'こおり',     desc:'つらぬく氷。敵が おそくなる',     up:'貫通↑ Lv3から こおる'},
  water:   {icon:'🌊', name:'なみ',       desc:'波で 敵を おしながす',            up:'波が大きく・つよく'},
  herb:    {icon:'🌿', name:'やくそう',   desc:'回復エリアが はえる。中にいると じわじわ回復', up:'エリアが広く 回復↑'},
  rate:    {icon:'⏩', name:'れんしゃ',   desc:'ぜんぶのスキルが 10%はやく',      boost:true, on:g=>{g.st.cd*=0.9;}},
  bspd:    {icon:'💫', name:'だんそく',   desc:'弾の速さ +20%',                   boost:true, max:3, on:g=>{g.st.bspd*=1.2;}},
  move:    {icon:'👟', name:'あしのはやさ', desc:'移動 +8%',                      boost:true, on:g=>{g.st.move*=1.08;}},
  magnet:  {icon:'🧲', name:'ひろいじょうず', desc:'かけらを ひろう はんい +30%',  boost:true, on:g=>{g.st.magnet*=1.3;}},
  power:   {icon:'💥', name:'こうげきアップ', desc:'ぜんぶのダメージ +15%',       boost:true, on:g=>{g.st.power*=1.15;}},
  hp:      {icon:'💗', name:'げんき',     desc:'最大HP +20、30回復',              boost:true, on:g=>{g.p.maxHp+=20; heal(30);}},
};
/* いつでも嬉しい枠（Lv3以上のスキルができた後に混ざる。選べるスキルが足りない時の穴埋めにも使う） */
const BONUS = {
  snack:  {icon:'💖', name:'ハート',       desc:'HPを 50 回復',                    tag:'かいふく', on:g=>{heal(50);}},
  charge: {icon:'🌟', name:'大技チャージ', desc:'大技ゲージ +50%',                 tag:'ボーナス', on:g=>{g.ult=Math.min(g.ultNeed,g.ult+g.ultNeed*0.5);}},
  vacuum: {icon:'🧹', name:'かけらあつめ', desc:'おちている かけらを ぜんぶ ひろう', tag:'ボーナス', on:g=>{for(const x of g.gems) x.spd=Math.max(x.spd,300);}},
};
const skMax = id => SKILLS[id].max||CFG.SKILL_MAX;

const ETYPES = {
  ant:      {ai:'ant',  r:9,  hp:6,    spd:72,  dmg:4,  xp:1},                              // 行列でぞろぞろ
  bee:      {ai:'bee',  r:9,  hp:8,    spd:118, dmg:5,  xp:1},                              // 小さくて速い
  cat:      {ai:'cat',  r:15, hp:18,   spd:56,  dmg:8,  xp:1},                              // 基本の追跡役。たまにダッシュ
  crow:     {ai:'crow', r:14, hp:22,   spd:115, dmg:10, xp:2},                              // 上空から急降下
  dog:      {ai:'dog',  r:24, hp:80,   spd:36,  dmg:14, xp:4},                              // 直進突進、体力高め
  bosscat:  {ai:'cat',  r:50, hp:900,  spd:52,  dmg:22, xp:0, boss:true, name:'ボスネコ'},   // ボスのHPは制限時間に比例（5分基準）
  bosscrow: {ai:'crow', r:46, hp:1500, spd:150, dmg:24, xp:0, boss:true, name:'ボスカラス'},
  hand:     {ai:'hand', r:62, hp:5000, spd:170, dmg:35, xp:0, boss:true, name:'手'},
};

/* ---------- 小道具 ---------- */
const TAU = Math.PI*2;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const pick = arr => arr[(Math.random()*arr.length)|0];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const fmtTime = s => { s=Math.max(0,Math.floor(s)); return ((s/60)|0)+':'+String(s%60).padStart(2,'0'); };
function compact(arr,keep){ let j=0; for(let i=0;i<arr.length;i++){ if(keep(arr[i])) arr[j++]=arr[i]; } arr.length=j; }

function loadSave(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(CFG.SAVE_KEY)); }catch(e){}
  if(!s||typeof s!=='object'){
    s={};
    try{ const o=JSON.parse(localStorage.getItem('norun-survival-v1')); if(o){ if(o.clear) s.anyClear=true; s.mute=!!o.mute; } }catch(e){}  // v1の記録を引き継ぎ
  }
  s.best=s.best||{}; s.clears=s.clears||{}; s.totalKills=s.totalKills||0;
  if(!FORMS[s.form]) s.form='normal';
  if(!CFG.LIMITS.includes(s.limit)) s.limit=CFG.DEFAULT_LIMIT;
  return s;
}

/* ---------- 効果音（仮：WebAudio合成音） ---------- */
let AC=null, muted=!!save.mute;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const lastSfx={};
function gate(k,ms){ const n=performance.now(); if(n-(lastSfx[k]||0)<ms) return false; lastSfx[k]=n; return true; }
const SFX = {
  shoot(){ if(gate('s',90)) tone(820,0.05,'triangle',0.018,260); },
  zap(){ tone(1400,0.12,'sawtooth',0.03,-900); },
  fire(){ tone(220,0.25,'sawtooth',0.03,200); },
  wave(){ tone(240,0.35,'sine',0.05,-120); },
  kill(){ if(gate('k',40)) tone(260,0.08,'square',0.018,-140); },
  pick(){ if(gate('p',50)) tone(1250,0.06,'sine',0.03,400); },
  hurt(){ tone(170,0.2,'sawtooth',0.06,-90); },
  heal(){ tone(660,0.1,'sine',0.05); tone(990,0.14,'sine',0.05,0,0.09); },
  level(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.13,'triangle',0.06,0,i*0.07)); },
  phase(){ tone(900,0.3,'sine',0.05,-500); },
  boss(){ tone(110,0.6,'sawtooth',0.07,-40); },
  ready(){ tone(880,0.1,'triangle',0.05); tone(1320,0.16,'triangle',0.05,0,0.1); },
  ult(){ tone(200,0.7,'sawtooth',0.07,1400); [784,988,1175,1568].forEach((f,i)=>tone(f,0.2,'triangle',0.06,0,0.15+i*0.08)); },
  clear(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.22,'triangle',0.07,0,i*0.12)); },
  over(){ [392,330,262,196].forEach((f,i)=>tone(f,0.25,'triangle',0.06,0,i*0.16)); },
};

/* ---------- 画面 ---------- */
const cv=$('cv'), ctx=cv.getContext('2d');
let VW=800, VH=600, SC=1, DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth, h=window.innerHeight;
  SC=clamp(Math.min(w,h)/520,0.7,1.5);
  VW=w/SC; VH=h/SC;
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
}
window.addEventListener('resize',resize);

/* ---------- 入力 ---------- */
const keys={};
const stick={on:false,id:-1,ox:0,oy:0,x:0,y:0};
const dbg={x:0,y:0};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  if(e.repeat) return;
  if(state==='levelup' && ['1','2','3'].includes(k)) pickCard(+k-1);
  else if(state==='play' && (k===' '||k==='e')) useUlt();
  else if((k==='p'||k==='escape') && state==='play') pause();
  else if((k==='p'||k==='escape') && state==='pause') resume();
  else if(k==='enter' && (state==='title'||state==='end')) start();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||stick.on) return;
  stick.on=true; stick.id=e.pointerId; stick.ox=e.clientX; stick.oy=e.clientY; stick.x=0; stick.y=0;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!stick.on||e.pointerId!==stick.id) return;
  let dx=(e.clientX-stick.ox)/46, dy=(e.clientY-stick.oy)/46;
  const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  stick.x=dx; stick.y=dy;
});
function stickEnd(e){ if(e&&e.pointerId!==stick.id) return; stick.on=false; stick.x=stick.y=0; }
cv.addEventListener('pointerup',stickEnd);
cv.addEventListener('pointercancel',stickEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function getInput(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft']) x-=1;
  if(keys['d']||keys['arrowright']) x+=1;
  if(keys['w']||keys['arrowup']) y-=1;
  if(keys['s']||keys['arrowdown']) y+=1;
  if(x||y){ const m=Math.hypot(x,y); return {x:x/m,y:y/m}; }
  if(stick.on){ const m=Math.hypot(stick.x,stick.y); if(m>0.12) return {x:stick.x,y:stick.y}; }
  if(dbg.x||dbg.y) return {x:dbg.x,y:dbg.y};
  return {x:0,y:0};
}

/* ---------- ゲーム状態 ---------- */
let state='title';   // title | play | levelup | pause | end
let G=null, animT=0, cards=[], cardsReadyAt=0;
const xpNeed = l => Math.floor(4+l*3+l*l*0.15);

function newGame(form,limit){
  const c=CFG.WORLD/2;
  G={
    form, limit, t:0, kills:0, level:1, xp:0, need:xpNeed(1), pending:0, ult:0, ultNeed:CFG.ULT_NEED, banked:false,
    p:{x:c,y:c,vx:0,vy:0,hp:0,maxHp:CFG.PLAYER_HP+(form==='penguin'?PERK.penguinHp:0),form,inv:0,phase:0,phaseCd:0,giant:0,dir:1,r:16,tilt:0,bob:0,flip:1},
    st:{power:1,cd:1,bspd:1,move:185,magnet:72*(form==='normal'?PERK.normalMagnet:1)},
    sk:{shot:1},
    tm:{shot:0.4,homing:0.6,ice:0.8,fire:1,thunder:1.2,water:1.4,halo:0.3,herb:2},
    orbA:0, haloPulse:0,
    enemies:[],bullets:[],gems:[],fx:[],zones:[],herbs:[],bolts:[],falls:[],finale:false,handOut:false,antT:3,

  };
  G.p.hp=G.p.maxHp;
}
function heal(n){ const p=G.p; p.hp=Math.min(p.maxHp,p.hp+n); }
const prog = () => G.t/G.limit;
function power(){   // 全ダメージ倍率（パンは速いほど強い）
  const p=G.p; let m=G.st.power;
  if(p.form==='pan') m*=1+Math.min(PERK.panCap,Math.hypot(p.vx,p.vy)/220*PERK.panPerSpeed);
  return m;
}
function onScreen(e,m){ const p=G.p; return Math.abs(e.x-p.x)<VW/2+(m||60) && Math.abs(e.y-p.y)<VH/2+(m||60); }

/* ---------- 敵 ---------- */
function addEnemy(type,at){
  const T=ETYPES[type], p=G.p, pr=prog();
  let x,y;
  if(at){ x=at.x; y=at.y; }
  else{ const a=rand(0,TAU), d=Math.hypot(VW,VH)/2+50+(T.boss?40:0); x=p.x+Math.cos(a)*d; y=p.y+Math.sin(a)*d; }
  const hp=T.boss ? T.hp*(G.limit/300) : T.hp*(1+CFG.ENEMY_HP_GROWTH*pr)*(G.finale?CFG.FINALE_HP:1);
  const e={type,ai:T.ai,boss:!!T.boss,x,y,r:T.r,hp,maxHp:hp,
    spd:T.spd*(1+CFG.ENEMY_SPD_GROWTH*pr),dmg:T.dmg*(T.boss?1:1+CFG.ENEMY_DMG_GROWTH*pr),xp:T.xp,
    st:0,tmr:T.ai==='hand'?1.2:rand(1.5,4),dx:0,dy:0,tx:x,ty:y,alt:T.ai==='crow'?120:T.ai==='hand'?170:0,face:1,lead:null,
    slow:0,stun:0,burn:0,burnD:0,poison:0,poisonD:0,flash:0,slamCd:0,orbCd:0,kx:0,ky:0,wob:rand(0,TAU),dead:false};
  G.enemies.push(e); return e;
}
function addAntLine(){   // アリは3〜5匹の行列で来る（先頭を後ろが追いかける）
  const p=G.p, a=rand(0,TAU), d=Math.hypot(VW,VH)/2+50, n=3+((Math.random()*3)|0); let lead=null;
  for(let i=0;i<n;i++){ const e=addEnemy('ant',{x:p.x+Math.cos(a)*(d+i*22),y:p.y+Math.sin(a)*(d+i*22)}); e.lead=lead; lead=e; }
}
function countType(t){ let n=0; for(const e of G.enemies) if(e.type===t) n++; return n; }
function spawn(dt){
  const pr=prog();
  if(G.bossIdx<CFG.BOSSES.length && pr>=CFG.BOSSES[G.bossIdx].at){
    const b=CFG.BOSSES[G.bossIdx++]; addEnemy(b.type); banner(ETYPES[b.type].name+' が あらわれた！'); SFX.boss();
  }
  if(!G.finale && G.limit-G.t<=CFG.FINALE){ G.finale=true; banner('さいごの だいラッシュ！'); SFX.boss(); }
  if(!G.handOut && G.limit-G.t<=CFG.HAND_AT){
    G.handOut=true; addEnemy('hand',{x:G.p.x,y:G.p.y-280}); banner('おおきな 手 が つかまえにきた！ にげきれ！'); SFX.boss();
  }
  G.antT-=dt;
  if(G.antT<=0){ G.antT=lerp(CFG.ANT_INTERVAL[0],CFG.ANT_INTERVAL[1],pr); if(countType('ant')<=CFG.ANT_MAX-3) addAntLine(); }
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=lerp(CFG.SPAWN_INTERVAL[0],CFG.SPAWN_INTERVAL[1],pr)*(G.finale?CFG.FINALE_SPAWN:1);
    const n=1+Math.floor(pr*CFG.SPAWN_EXTRA+Math.random()), cap=G.finale?CFG.FINALE_MAX:CFG.MAX_ENEMIES;
    const pb=pr>0.08?0.2+pr*0.12+(G.finale?0.08:0):0;      // ハチ
    const pc=pr>0.3?0.06+pr*0.05:0;                         // カラス
    const pd=pr>0.22?0.08+pr*0.08+(G.finale?0.04:0):0;      // いぬ
    let crows=countType('crow');
    for(let i=0;i<n&&G.enemies.length<cap;i++){
      const r=Math.random(); let type='cat';
      if(r<pb) type='bee';
      else if(r<pb+pc){ if(crows<CFG.CROW_MAX){ type='crow'; crows++; } }
      else if(r<pb+pc+pd) type='dog';
      addEnemy(type);
    }
  }
}
function hurtEnemy(e,d,quiet){
  if(e.dead) return;
  e.hp-=d; if(!quiet) e.flash=0.08;
  if(e.hp<=0){ e.dead=true; onKill(e); }
}
function applyPoison(e){
  const L=G.sk.poison; if(!L||e.dead) return;
  const ob=G.p.form==='obake';
  e.poison=ob?PERK.obakePoisonDur:4;
  e.poisonD=Math.max(e.poisonD,(4+3*L)*(ob?PERK.obakePoison:1)*power());
}
function onKill(e){
  G.kills++; SFX.kill();
  const before=G.ult;
  G.ult=Math.min(G.ultNeed,G.ult+(e.boss?10:1));
  if(before<G.ultNeed && G.ult>=G.ultNeed) SFX.ready();
  puff(e.x,e.y-e.alt,e.boss?30:6,'#fff3b0');
  if(e.boss){
    for(let i=0;i<12;i++){ const a=rand(0,TAU), d=rand(10,90); addGem(e.x+Math.cos(a)*d,e.y+Math.sin(a)*d,2); }
    G.gems.push({x:e.x,y:e.y,v:0,heart:true,spd:0,ph:0}); G.shake=0.4;
    if(CFG.BOSS_REWARD.level){ G.level++; G.need=xpNeed(G.level); G.pending++; }
    if(CFG.BOSS_REWARD.ult){ G.ult=G.ultNeed; SFX.ready(); }
    banner(ETYPES[e.type].name+' を たおした！ ごほうび！');
  }else{
    addGem(e.x,e.y,e.xp);
    if(Math.random()<CFG.HEART_RATE) G.gems.push({x:e.x+10,y:e.y,v:0,heart:true,spd:0,ph:0});
  }
}
function addGem(x,y,v){
  if(G.gems.length>=380){ const i=G.gems.findIndex(g=>!g.heart&&!g.herb); if(i>=0){ v+=G.gems[i].v; G.gems.splice(i,1); } }
  G.gems.push({x,y,v,spd:0,ph:rand(0,TAU)});
}
function nearestTo(x,y,maxD,skip){
  let bestE=null, bd=maxD*maxD;
  for(const e of G.enemies){ if(e.dead||(skip&&skip.includes(e))) continue; const dx=e.x-x, dy=e.y-y, d=dx*dx+dy*dy-e.r*e.r; if(d<bd){ bd=d; bestE=e; } }
  return bestE;
}

/* ---------- スキル ---------- */
function bullet(o){ G.bullets.push(Object.assign({r:6,pierce:0,life:1.5,hit:[],rot:rand(0,TAU),kb:60},o)); }
function skillShot(L){
  const p=G.p, tgt=nearestTo(p.x,p.y,560); if(!tgt) return false;
  // Lv2:弾2つ / Lv3:貫通1 / Lv4:当たると2つに分裂 / Lv5:弾3つ・分裂3つ
  const a=Math.atan2(tgt.y-p.y,tgt.x-p.x), n=L>=5?3:L>=2?2:1, spd=420*G.st.bspd, dmg=(10+2.5*(L-1))*power();
  for(let i=0;i<n;i++){ const g=a+(i-(n-1)/2)*0.17; bullet({kind:'star',x:p.x,y:p.y,vx:Math.cos(g)*spd,vy:Math.sin(g)*spd,dmg,pierce:L>=3?1:0,split:L>=5?3:L>=4?2:0}); }
  SFX.shoot(); return true;
}
function skillHoming(L){
  const p=G.p; if(!nearestTo(p.x,p.y,520)) return false;
  const n=1+Math.floor(L/2), spd=290*G.st.bspd;
  for(let i=0;i<n;i++){ const a=rand(0,TAU); bullet({kind:'homing',x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,spd,dmg:(14+4*L)*power(),life:2.6,r:7}); }
  SFX.shoot(); return true;
}
function skillIce(L){
  const p=G.p, tgt=nearestTo(p.x,p.y,480); if(!tgt) return false;
  const a=Math.atan2(tgt.y-p.y,tgt.x-p.x), spd=380*G.st.bspd;
  bullet({kind:'ice',x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:(8+3*L)*power(),pierce:2+L,r:8,freeze:L>=3?0.4+0.15*(L-3):0});
  SFX.shoot(); return true;
}
function skillFire(L){
  const p=G.p, tgt=nearestTo(p.x,p.y,430); if(!tgt) return false;
  G.zones.push({x:tgt.x,y:tgt.y,r:46+8*L,life:3,max:3,dps:(8+4*L)*power()});
  puff(tgt.x,tgt.y,8,'#ff9a4a'); SFX.fire(); return true;
}
function skillThunder(L){
  const p=G.p, kur=p.form==='kurage';
  const near=G.enemies.filter(e=>!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<380); if(!near.length) return false;
  const chainR=110*(kur?PERK.kurageChain:1), stun=(0.5+0.1*L)*(kur?PERK.kurageStun:1), dmg=(16+6*L)*power();
  const hit=[]; let cur=pick(near); const pts=[[p.x,p.y]];
  for(let i=0;i<2+L&&cur;i++){
    hit.push(cur); pts.push([cur.x,cur.y]);
    cur.stun=Math.max(cur.stun,cur.boss?stun*0.4:stun); hurtEnemy(cur,dmg);
    cur=nearestTo(pts[pts.length-1][0],pts[pts.length-1][1],chainR,hit);
  }
  addBolt(pts); SFX.zap(); return true;
}
function skillWater(L){
  const p=G.p, tgt=nearestTo(p.x,p.y,460); if(!tgt) return false;
  const a=Math.atan2(tgt.y-p.y,tgt.x-p.x);
  bullet({kind:'wave',x:p.x,y:p.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,dmg:(6+3*L)*power(),pierce:999,life:0.95,r:34+4*L,kb:520+60*L});
  SFX.wave(); return true;
}
function haloGeom(){ const L=G.sk.halo; return {R:100, w:(14+3*L)*(G.p.form==='penguin'?PERK.penguinHalo:1)}; }
function haloTick(){
  const p=G.p, L=G.sk.halo, {R,w}=haloGeom(), dmg=(5+3*L)*power();
  for(const e of G.enemies){ const d=Math.hypot(e.x-p.x,e.y-p.y); if(Math.abs(d-R)<w/2+e.r) hurtEnemy(e,dmg); }
  G.haloPulse=0.2;
}
function orbitGeom(){ const L=G.sk.orbit; return {n:1+L, R:66+4*L}; }
function orbitUpdate(dt){
  const p=G.p, L=G.sk.orbit, {n,R}=orbitGeom(), dmg=(8+3*L)*power();
  G.orbA+=2.6*dt;
  for(let k=0;k<n;k++){
    const a=G.orbA+k*TAU/n, ox=p.x+Math.cos(a)*R, oy=p.y+Math.sin(a)*R;
    for(const e of G.enemies){
      if(e.orbCd>0||e.dead) continue;
      const dx=e.x-ox, dy=e.y-oy, rr=e.r+10;
      if(dx*dx+dy*dy<rr*rr){ e.orbCd=0.5; hurtEnemy(e,dmg); applyPoison(e); if(!e.boss){ e.kx+=Math.cos(a)*120; e.ky+=Math.sin(a)*120; } }
    }
  }
}
const herbGeom = L => ({r:55+9*L, heal:2.5+1.2*L});   // 回復エリアの半径と回復量（HP/秒）
function sprout(){
  if(G.herbs.length>=2) return;
  const p=G.p, a=rand(0,TAU), d=rand(70,150), g=herbGeom(G.sk.herb);
  G.herbs.push({x:clamp(p.x+Math.cos(a)*d,60,CFG.WORLD-60),y:clamp(p.y+Math.sin(a)*d,60,CFG.WORLD-60),r:g.r,heal:g.heal,life:CFG.HERB_LIFE,trod:false});
}
function updateHerbs(dt){
  const p=G.p;
  for(const h of G.herbs){
    h.life-=dt;
    let n=0; for(const e of G.enemies){ const dx=e.x-h.x, dy=e.y-h.y; if(dx*dx+dy*dy<h.r*h.r) n+=e.boss?5:1; }
    h.trod=n>0;
    h.r-=Math.min(CFG.HERB_SHRINK_MAX,n*CFG.HERB_SHRINK)*dt;      // 敵が踏むと縮む（籠城対策）
    if(Math.hypot(p.x-h.x,p.y-h.y)<h.r) heal(h.heal*dt);
  }
  compact(G.herbs,h=>h.life>0&&h.r>16);
}
function updateSkills(dt){
  const sk=G.sk, tm=G.tm, cd=G.st.cd;
  const run=(id,base,fn)=>{ if(!sk[id]) return; tm[id]-=dt; if(tm[id]<=0) tm[id]=fn(sk[id])?base*cd:0.15; };
  run('shot',0.6,skillShot);
  run('homing',1.7,skillHoming);
  run('ice',1.8,skillIce);
  run('fire',3.2,skillFire);
  run('thunder',2.4,skillThunder);
  run('water',4.0,skillWater);
  if(sk.halo){ tm.halo-=dt; if(tm.halo<=0){ tm.halo=0.45*cd; haloTick(); } }
  if(sk.orbit) orbitUpdate(dt);
  if(sk.herb){ tm.herb-=dt; if(tm.herb<=0){ tm.herb=15-1.5*sk.herb; sprout(); } }
  if(G.haloPulse>0) G.haloPulse-=dt;
}
function addBolt(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    for(const t of [0.33,0.66]) out.push([lerp(a[0],b[0],t)+rand(-14,14),lerp(a[1],b[1],t)+rand(-14,14)]);
    out.push(b);
  }
  G.bolts.push({pts:out,life:0.22});
}

/* ---------- 大技 ---------- */
function useUlt(){
  if(state!=='play'||G.ult<G.ultNeed) return;
  G.ult=0; G.ultNeed+=CFG.ULT_STEP;
  const p=G.p, f=p.form, sc=(1+G.t/200)*G.st.power;
  banner(FORMS[f].ult+'！'); SFX.ult(); G.shake=0.3;
  if(f==='normal'){
    G.flash={c:'255,226,122',t:0.5};
    for(const e of G.enemies) if(onScreen(e)) G.falls.push({e,t:rand(0.1,1.2),dmg:160*sc});
  }else if(f==='kurage'){
    G.flash={c:'159,232,255',t:0.5}; let n=0;
    for(const e of G.enemies){
      if(Math.hypot(e.x-p.x,e.y-p.y)>440) continue;
      if(n++<14) addBolt([[p.x,p.y],[e.x,e.y]]);
      e.stun=Math.max(e.stun,e.boss?1.5:3.5); hurtEnemy(e,100*sc);
    }
  }else if(f==='pan'){
    G.flash={c:'243,207,142',t:0.4}; p.giant=4.5; puff(p.x,p.y,24,'#f3cf8e');
  }else if(f==='obake'){
    G.flash={c:'180,140,255',t:0.5}; p.phase=6;
    for(const e of G.enemies) if(onScreen(e)){ e.poison=8; e.poisonD=Math.max(e.poisonD,28*sc); puff(e.x,e.y,2,'#9be07a'); }
  }else if(f==='penguin'){
    G.flash={c:'220,245,255',t:0.6};
    for(const e of G.enemies) if(onScreen(e)){ e.stun=Math.max(e.stun,e.boss?2:4.5); e.slow=8; hurtEnemy(e,55*sc); }
  }
}

/* ---------- 更新 ---------- */
function update(dt){
  G.t+=dt;
  if(G.t>=G.limit){ endGame(true); return; }
  updatePlayer(dt);
  spawn(dt);
  updateEnemies(dt);
  if(state!=='play') return;
  updateSkills(dt);
  updateBullets(dt);
  updateZones(dt);
  updateHerbs(dt);
  updateGems(dt);
  for(const f of G.fx){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.life-=dt; }
  compact(G.fx,f=>f.life>0);
  for(const b of G.bolts) b.life-=dt;
  compact(G.bolts,b=>b.life>0);
  if(G.shake>0) G.shake-=dt;
  if(G.flash){ G.flash.t-=dt; if(G.flash.t<=0) G.flash=null; }
  compact(G.enemies,e=>!e.dead);
}
function updatePlayer(dt){
  const p=G.p, f=FORMS[p.form], inp=getInput();
  const sp=G.st.move*f.speed*(p.giant>0?1.5:1), k=Math.min(1,f.grip*(p.giant>0?3:1)*dt);
  p.vx+=(inp.x*sp-p.vx)*k; p.vy+=(inp.y*sp-p.vy)*k;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  const lo=40, hi=CFG.WORLD-40;
  if(p.x<lo){p.x=lo;p.vx=0;} else if(p.x>hi){p.x=hi;p.vx=0;}
  if(p.y<lo){p.y=lo;p.vy=0;} else if(p.y>hi){p.y=hi;p.vy=0;}
  if(Math.abs(inp.x)>0.2) p.dir=inp.x>0?1:-1;
  // 見た目の動き：進む方へ少し傾く／左右で反転／動いている間だけ上下に揺れる／止まると正面
  const spd=Math.hypot(p.vx,p.vy), tilt=clamp(p.vx/200,-1,1)*CFG.TILT_MAX*Math.PI/180;
  p.tilt+=(tilt-p.tilt)*Math.min(1,10*dt);
  p.bob+=((spd>25?1:0)-p.bob)*Math.min(1,8*dt);
  if(Math.abs(p.vx)>25) p.flip=p.vx>0?1:-1; else if(spd<15) p.flip=1;
  if(p.inv>0) p.inv-=dt;
  if(p.phase>0) p.phase-=dt;
  if(p.phaseCd>0) p.phaseCd-=dt;
  if(p.giant>0){ p.giant-=dt; if(p.giant<=0) p.inv=Math.max(p.inv,0.8); }
}
function enemyAI(e,dt,p,dx,dy,d){
  const sl=e.slow>0?0.5:1, sp=e.spd*sl*dt, ux=dx/d, uy=dy/d;
  if(Math.abs(dx)>4) e.face=dx>0?1:-1;
  switch(e.ai){
    case 'ant':{   // 前のアリについていく。先頭はくねくね近づく
      let l=e.lead; while(l&&l.dead) l=l.lead; e.lead=l||null;
      if(l){
        const lx=l.x-e.x, ly=l.y-e.y, ld=Math.hypot(lx,ly)||1, gap=e.r*2+3;
        if(ld>gap){ const v=Math.min(sp*1.4,ld-gap); e.x+=lx/ld*v; e.y+=ly/ld*v; }
        if(Math.abs(lx)>2) e.face=lx>0?1:-1;
      }else{ const a=Math.atan2(dy,dx)+Math.sin(G.t*2.2+e.wob)*0.55; e.x+=Math.cos(a)*sp; e.y+=Math.sin(a)*sp; }
      break; }
    case 'bee':{   // ジグザグに飛んでくる
      const z=Math.sin(G.t*7+e.wob)*0.8; e.x+=(ux-uy*z)*sp; e.y+=(uy+ux*z)*sp; break; }
    case 'cat':{   // 0:追跡 → 1:ためる → 2:ダッシュ
      e.tmr-=dt;
      if(e.st===0){ e.x+=ux*sp; e.y+=uy*sp; if(e.tmr<=0&&d<340){ e.st=1; e.tmr=e.boss?0.5:0.4; } }
      else if(e.st===1){ if(e.tmr<=0){ e.st=2; e.tmr=e.boss?0.6:0.45; e.dx=ux; e.dy=uy; } }
      else{ const v=sp*(e.boss?3.4:2.8); e.x+=e.dx*v; e.y+=e.dy*v; if(e.tmr<=0){ e.st=0; e.tmr=e.boss?rand(1.8,3.2):rand(3.5,6); } }
      break; }
    case 'dog':{   // 0:歩く → 1:ねらう → 2:まっすぐ突進 → 3:ひとやすみ
      e.tmr-=dt;
      if(e.st===0){ e.x+=ux*sp; e.y+=uy*sp; if(e.tmr<=0&&d<430){ e.st=1; e.tmr=0.7; } }
      else if(e.st===1){ e.dx=ux; e.dy=uy; if(e.tmr<=0){ e.st=2; e.tmr=1.15; } }
      else if(e.st===2){ const v=CFG.DOG_RUSH*sl*dt; e.x+=e.dx*v; e.y+=e.dy*v; e.face=e.dx>0?1:-1; if(e.tmr<=0){ e.st=3; e.tmr=0.9; } }
      else if(e.tmr<=0){ e.st=0; e.tmr=rand(0.6,1.6); }
      break; }
    case 'crow':{  // 0:上空を旋回 → 1:予告 → 2:急降下 → 3:着地中（この間だけ当たる）
      e.tmr-=dt;
      if(e.st===0){
        e.alt+=(120-e.alt)*Math.min(1,4*dt);
        const R=e.boss?240:200, k=clamp((d-R)/80,-1,1);
        e.x+=(-uy*0.9+ux*k)*sp; e.y+=(ux*0.9+uy*k)*sp;
        if(e.tmr<=0&&d<330){ e.st=1; e.tmr=e.boss?0.7:0.55; e.tx=p.x; e.ty=p.y; }
      }else if(e.st===1){ if(e.tmr<=0) e.st=2; }
      else if(e.st===2){
        const lx=e.tx-e.x, ly=e.ty-e.y, ld=Math.hypot(lx,ly), v=CFG.CROW_DIVE*sl*dt;
        if(ld<=v+2){ e.x=e.tx; e.y=e.ty; e.alt=0; e.st=3; e.tmr=e.boss?1.1:0.9; if(e.boss){ G.shake=0.2; puff(e.x,e.y,10,'#cfc7ff'); } }
        else{ e.x+=lx/ld*v; e.y+=ly/ld*v; e.alt=Math.min(e.alt,ld*0.6); e.face=lx>0?1:-1; }
      }else{ e.alt=0; if(e.tmr<=0){ e.st=0; e.tmr=e.boss?rand(1.5,2.5):rand(2.5,4.5); } }
      break; }
    case 'hand':{  // 0:上から追いかける → 1:予告 → 2:ふりおろす → 3:地面（この間だけ当たる）
      e.tmr-=dt;
      if(e.st===0){
        e.alt+=(170-e.alt)*Math.min(1,5*dt);
        const v=Math.min(sp,d); e.x+=ux*v; e.y+=uy*v;
        if(e.tmr<=0&&d<130){ e.st=1; e.tmr=CFG.HAND_WARN; e.tx=p.x; e.ty=p.y; }
      }else if(e.st===1){ const k=Math.min(1,8*dt); e.x+=(e.tx-e.x)*k; e.y+=(e.ty-e.y)*k; if(e.tmr<=0) e.st=2; }
      else if(e.st===2){ e.alt-=1300*dt; if(e.alt<=0){ e.alt=0; e.st=3; e.tmr=0.7; G.shake=0.3; puff(e.x,e.y,14,'#f6cfae'); SFX.wave(); } }
      else if(e.tmr<=0){ e.st=0; e.tmr=rand(1.0,1.8); }
      break; }
  }
}
function updateEnemies(dt){
  const p=G.p, es=G.enemies, giant=p.giant>0, pr=p.r*(giant?2.4:0.8);
  for(const e of es){
    if(e.dead) continue;
    if(e.flash>0) e.flash-=dt;
    if(e.slow>0) e.slow-=dt;
    if(e.slamCd>0) e.slamCd-=dt;
    if(e.orbCd>0) e.orbCd-=dt;
    if(e.burn>0){ e.burn-=dt; hurtEnemy(e,e.burnD*dt,true); }
    if(e.poison>0){ e.poison-=dt; hurtEnemy(e,e.poisonD*dt,true); if(e.poison<=0) e.poisonD=0; }
    if(e.dead) continue;
    let dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
    if(d>1500&&!e.boss){ const a=rand(0,TAU), r=Math.hypot(VW,VH)/2+50; e.x=p.x+Math.cos(a)*r; e.y=p.y+Math.sin(a)*r; continue; }
    if(e.stun>0) e.stun-=dt; else enemyAI(e,dt,p,dx,dy,d);
    if(e.kx||e.ky){ e.x+=e.kx*dt; e.y+=e.ky*dt; const dec=Math.max(0,1-6*dt); e.kx*=dec; e.ky*=dec; if(Math.abs(e.kx)+Math.abs(e.ky)<2){e.kx=0;e.ky=0;} }
    dx=p.x-e.x; dy=p.y-e.y; d=Math.hypot(dx,dy)||1;
    if(d<e.r+pr && e.alt<25){   // 上空にいる間（カラス・手）は当たらない
      if(giant){
        if(e.slamCd<=0){ e.slamCd=0.25; const kb=e.boss?80:420; e.kx=-dx/d*kb; e.ky=-dy/d*kb; hurtEnemy(e,80*(1+G.t/200)*power()); puff(e.x,e.y,3,'#f6d9a0'); }
      }else if(p.phase<=0 && p.inv<=0){
        if(p.form==='obake'&&p.phaseCd<=0){ p.phase=PERK.obakePhase; p.phaseCd=PERK.obakeCd; SFX.phase(); }
        else{
          p.hp-=e.dmg; p.inv=0.7; G.shake=0.18; SFX.hurt(); puff(p.x,p.y,5,'#ff8fa8');
          if(p.hp<=0){ p.hp=0; endGame(false); return; }
        }
      }
    }
  }
  const n=es.length;
  for(let i=0;i<n;i++){
    const a=es[i]; if(a.alt>40) continue;
    for(let j=i+1;j<n;j++){
      const b=es[j], dx=b.x-a.x, rr=a.r+b.r;
      if(dx>rr||dx<-rr||b.alt>40) continue;
      const dy=b.y-a.y; if(dy>rr||dy<-rr) continue;
      const d2=dx*dx+dy*dy; if(d2>=rr*rr||d2===0) continue;
      const d=Math.sqrt(d2), push=(rr-d)*0.25, ux=dx/d, uy=dy/d, wa=a.boss?0:1, wb=b.boss?0:1;
      a.x-=ux*push*wa; a.y-=uy*push*wa; b.x+=ux*push*wb; b.y+=uy*push*wb;
    }
  }
  // 星のシャワー
  for(const f of G.falls){ f.t-=dt; if(f.t<=0&&!f.e.dead){ hurtEnemy(f.e,f.dmg); puff(f.e.x,f.e.y,5,'#ffe27a'); } }
  compact(G.falls,f=>f.t>0&&!f.e.dead);
  compact(es,e=>!e.dead);
}
function updateBullets(dt){
  const bs=G.bullets, es=G.enemies;
  for(const b of bs){
    if(b.kind==='homing'){
      if(!b.tg||b.tg.dead) b.tg=nearestTo(b.x,b.y,520);
      if(b.tg){
        const want=Math.atan2(b.tg.y-b.y,b.tg.x-b.x), cur=Math.atan2(b.vy,b.vx);
        let df=want-cur; while(df>Math.PI) df-=TAU; while(df<-Math.PI) df+=TAU;
        const a=cur+clamp(df,-7*dt,7*dt); b.vx=Math.cos(a)*b.spd; b.vy=Math.sin(a)*b.spd;
      }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; b.rot+=dt*9;
    if(b.life<=0) continue;
    for(const e of es){
      if(e.dead) continue;
      const dx=e.x-b.x, dy=e.y-b.y, rr=e.r+b.r;
      if(dx*dx+dy*dy>rr*rr||b.hit.includes(e)) continue;
      hurtEnemy(e,b.dmg);
      if(b.kind==='ice'){ e.slow=3; if(b.freeze) e.stun=Math.max(e.stun,e.boss?b.freeze*0.5:b.freeze); }
      if(b.kind!=='wave') applyPoison(e);
      if(b.split){   // 星弾の分裂（最初に当たった時に1回だけ）
        const n=b.split, a0=Math.atan2(b.vy,b.vx), sp=Math.hypot(b.vx,b.vy); b.split=0;
        for(let i=0;i<n;i++){ const g=a0+(i-(n-1)/2)*0.7; bullet({kind:'star',x:e.x,y:e.y,vx:Math.cos(g)*sp,vy:Math.sin(g)*sp,dmg:b.dmg*0.5,r:4,life:0.45,hit:[e]}); }
      }
      const m=Math.hypot(b.vx,b.vy)||1, kb=b.kb*(e.boss?0.12:1); e.kx+=b.vx/m*kb; e.ky+=b.vy/m*kb;
      if(b.pierce>0){ b.pierce--; b.hit.push(e); } else { b.life=0; break; }
    }
  }
  compact(bs,b=>b.life>0);
}
function updateZones(dt){
  for(const z of G.zones){
    z.life-=dt;
    for(const e of G.enemies){ const dx=e.x-z.x, dy=e.y-z.y, rr=z.r+e.r*0.5; if(dx*dx+dy*dy<rr*rr){ e.burn=2; e.burnD=Math.max(e.burnD,z.dps); } }
  }
  compact(G.zones,z=>z.life>0);
}
function updateGems(dt){
  const p=G.p, mag=G.st.magnet;
  for(const g of G.gems){
    const dx=p.x-g.x, dy=p.y-g.y, d=Math.hypot(dx,dy)||1;
    if(d<mag||g.spd>0){ g.spd=Math.min(620,g.spd+1500*dt); g.x+=dx/d*g.spd*dt; g.y+=dy/d*g.spd*dt; }
    if(d<p.r+10){
      g.got=true;
      if(g.heart){ heal(20); SFX.heal(); }
      else{ SFX.pick(); G.xp+=g.v; while(G.xp>=G.need){ G.xp-=G.need; G.level++; G.need=xpNeed(G.level); G.pending++; } }
    }
  }
  compact(G.gems,g=>!g.got);
}
function puff(x,y,n,color){
  if(G.fx.length>260) return;
  for(let i=0;i<n;i++){ const a=rand(0,TAU), s=rand(30,150); G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.25,0.55),max:0.55,r:rand(2,5),color}); }
}

/* ---------- レベルアップ（スキル3択） ---------- */
function rollCards(){
  const sk=G.sk; let pool=shuffle(Object.keys(SKILLS).filter(id=>(sk[id]||0)<skMax(id)));
  const out=[], aff=FORMS[G.p.form].aff;
  if(G.level===2 && aff && pool.includes(aff)){ out.push(aff); pool=pool.filter(x=>x!==aff); }
  while(out.length<3&&pool.length) out.push(pool.pop());
  const bonus=shuffle(Object.keys(BONUS));                                  // ボーナス枠は '!' 付きのid
  const anyMax=Object.keys(sk).some(id=>sk[id]>=CFG.BONUS_FROM_LV);
  if(out.length===3 && anyMax && Math.random()<CFG.BONUS_RATE) out[2]='!'+bonus.pop();
  while(out.length<3) out.push('!'+bonus.pop());
  return shuffle(out);
}
function openLevelUp(){
  state='levelup'; stickEnd(); cards=rollCards(); cardsReadyAt=performance.now()+280;
  const box=$('cards'); box.innerHTML='';
  cards.forEach((id,i)=>{
    const bonus=id[0]==='!', S=bonus?BONUS[id.slice(1)]:SKILLS[id], L=bonus?0:(G.sk[id]||0), isNew=!bonus&&!S.boost&&L===0;
    const b=document.createElement('button'); b.className='card'+(isNew?' newsk':'');
    const tag=document.createElement('em'); tag.textContent=bonus?S.tag:isNew?'あたらしい':'Lv '+L+' → '+(L+1);
    const ic=document.createElement('span'); ic.className='ic'; ic.textContent=S.icon;
    const h=document.createElement('b'); h.textContent=S.name;
    const d=document.createElement('span'); d.className='d'; d.textContent=(S.ups&&S.ups[L+1])||((L>0&&S.up)?S.up:S.desc);
    b.append(tag,ic,h,d); b.onclick=()=>pickCard(i); box.appendChild(b);
  });
  $('levelup').classList.add('on'); SFX.level();
}
function pickCard(i){
  if(state!=='levelup'||performance.now()<cardsReadyAt) return;
  const id=cards[i]; if(!id) return;
  if(id[0]==='!') BONUS[id.slice(1)].on(G);
  else{ G.sk[id]=(G.sk[id]||0)+1; if(SKILLS[id].on) SKILLS[id].on(G); }
  G.pending--; G.p.inv=Math.max(G.p.inv,0.6);
  if(G.pending>0) openLevelUp();
  else{ $('levelup').classList.remove('on'); state='play'; }
}

/* ---------- タイトル：へんしん・時間えらび ---------- */
function buildTitle(){
  const box=$('forms'); box.innerHTML='';
  for(const f of Object.keys(FORMS)){
    const open=isOpen(f);
    const b=document.createElement('button'); b.className='fbtn'+(open?'':' lock')+(save.form===f?' sel':'');
    const c=document.createElement('canvas'); c.width=96; c.height=96;
    const g=c.getContext('2d'); g.save(); g.scale(1.5,1.5); g.translate(32,40); drawNorun(g,f,0,false); g.restore();
    const n=document.createElement('div'); n.textContent=FORMS[f].name;
    b.append(c,n);
    b.onclick=()=>{ if(open){ save.form=f; persist(); newGame(f,save.limit); buildTitle(); } else showFormInfo(f); };
    box.appendChild(b);
  }
  showFormInfo(save.form);
  const lb=$('limits').children;
  for(let i=0;i<lb.length;i++){
    const el=lb[i], l=+el.getAttribute('data-l');
    el.classList.toggle('sel',l===save.limit);
    el.onclick=()=>{ save.limit=l; persist(); newGame(save.form,l); buildTitle(); };
  }
  $('bestTitle').textContent=bestText(save.limit);
}
function showFormInfo(f){
  const F=FORMS[f];
  $('formInfo').innerHTML = isOpen(f)
    ? '<b>'+F.name+'</b>：'+F.perk+'<br><i>大技</i> <b>'+F.ult+'</b>（'+F.ultDesc+'）'
    : '🔒 <b>'+F.name+'</b><br><i>かいほう じょうけん：</i>'+UNLOCK[f].how(save);
}
function bestText(limit){
  const b=save.best[limit]; if(!b) return '';
  return (limit/60)+'分ベスト： '+fmtTime(b.time)+(b.clear?'（クリア！）':'')+' ／ '+b.kills+' たおした';
}

/* ---------- 画面遷移 ---------- */
function showOnly(id){ for(const k of ['title','levelup','pause','end']) $(k).classList.toggle('on',k===id); }
function setPlayUi(on){ $('hud').classList.toggle('on',on); $('btnUlt').classList.toggle('on',on); }
function start(formOverride){
  initAudio();
  const f=(typeof formOverride==='string'&&FORMS[formOverride])?formOverride:save.form;
  newGame(f,save.limit); state='play'; showOnly(null); setPlayUi(true);
}
function bankKills(){ if(G&&!G.banked){ G.banked=true; save.totalKills+=G.kills; persist(); } }
function toTitle(){
  bankKills(); if(!isOpen(save.form)) save.form='normal';
  newGame(save.form,save.limit); state='title'; setPlayUi(false); buildTitle(); showOnly('title');
}
function pause(){ if(state!=='play') return; state='pause'; stickEnd(); showOnly('pause'); }
function resume(){ if(state!=='pause') return; state='play'; showOnly(null); }
function endGame(clear){
  state='end'; stickEnd(); $('btnUlt').classList.remove('on');
  const wasOpen=Object.keys(FORMS).filter(isOpen);
  const time=clear?G.limit:G.t, b=save.best[G.limit]||(save.best[G.limit]={time:0,kills:0,clear:false});
  const newT=time>b.time, newK=G.kills>b.kills;
  if(newT) b.time=time; if(newK) b.kills=G.kills;
  if(clear){ b.clear=true; save.anyClear=true; save.clears[G.form]=(save.clears[G.form]||0)+1; }
  bankKills(); persist();
  const opened=Object.keys(FORMS).filter(f=>isOpen(f)&&!wasOpen.includes(f));
  $('endTitle').textContent=clear?'🌟 クリア！':'やられちゃった…';
  $('endMsg').textContent=clear?'つかまらずに にげきった！':'もういちど ちょうせんしてみよう';
  $('eTime').innerHTML=fmtTime(time)+(newT?'<span class="new">NEW</span>':'');
  $('eKills').innerHTML=G.kills+(newK?'<span class="new">NEW</span>':'');
  $('eLv').textContent=G.level;

/* ---------- のるんの絵（仮：Canvas描画） ----------
   正本ルール：変身中は帽子なし／顔（眠そうな半目・小さい口・舌）は全姿共通／ペンギンにくちばし無し */
const spriteImg={};
for(const k in SPRITES){ if(SPRITES[k]){ const im=new Image(); im.onload=()=>{ if(state==='title') buildTitle(); }; im.src=SPRITES[k]; spriteImg[k]=im; } }
function drawFace(c,y){
  c.fillStyle='#3b3352';
  for(const s of [-1,1]){
    c.beginPath(); c.arc(s*6.2,y,3.1,0,Math.PI); c.closePath(); c.fill();
    c.fillRect(s*6.2-3.9,y-0.9,7.8,1.6);
  }
  c.strokeStyle='#3b3352'; c.lineWidth=1.3; c.lineCap='round';
  c.beginPath(); c.moveTo(-2.3,y+5.4); c.lineTo(2.3,y+5.4); c.stroke();
  c.fillStyle='#ff8fa8'; c.beginPath(); c.arc(0.5,y+5.9,1.9,0,Math.PI); c.closePath(); c.fill();
}
function drawNorun(c,form,t,phasing){   // 原点＝体の中心。傾き・反転・上下の揺れは呼ぶ側でかける
  const img=spriteImg[form];
  if(img&&img.complete&&img.naturalWidth){
    const h=CFG.SPRITE_H, w=h*img.naturalWidth/img.naturalHeight;
    c.save(); if(form==='obake') c.globalAlpha*=phasing?0.45:0.92;
    c.drawImage(img,-w/2,-h/2+CFG.SPRITE_DY,w,h); c.restore(); return;
  }
  c.save();
  if(form==='normal'){
    c.fillStyle='#fffdf7';
    c.beginPath(); c.arc(0,0,15.5,0,TAU); c.fill();
    for(let i=0;i<10;i++){ const a=i/10*TAU+Math.sin(t*2+i)*0.06; c.beginPath(); c.arc(Math.cos(a)*13.2,Math.sin(a)*13.2,6.2,0,TAU); c.fill(); }
    drawFace(c,0);
    c.fillStyle='#1c1826';
    c.beginPath(); c.ellipse(0,-14.5,17.5,4.8,-0.1,0,TAU); c.fill();
    c.beginPath(); c.moveTo(-10,-15.5); c.quadraticCurveTo(-4,-30,7,-40); c.quadraticCurveTo(6,-26,10,-17); c.closePath(); c.fill();
    c.strokeStyle='#8f74e0'; c.lineWidth=2.4; c.beginPath(); c.moveTo(-9.4,-17.6); c.quadraticCurveTo(0,-15.2,9.6,-19); c.stroke();
  }else if(form==='kurage'){
    c.strokeStyle='#cfe6ff'; c.lineWidth=2.2; c.lineCap='round';
    for(let i=-2;i<=2;i++){ const x=i*5.5, w=Math.sin(t*4+i)*2.5; c.beginPath(); c.moveTo(x,8); c.quadraticCurveTo(x+w,15,x-w,22); c.stroke(); }
    c.fillStyle='#f4f9ff';
    c.beginPath(); c.moveTo(-17,6); c.bezierCurveTo(-18,-22,18,-22,17,6);
    for(let i=0;i<4;i++){ const x0=17-i*8.5; c.quadraticCurveTo(x0-4.25,11,x0-8.5,6); }
    c.closePath(); c.fill();
    c.fillStyle='rgba(159,216,255,.35)'; c.beginPath(); c.ellipse(-7,-9,4,2.4,-0.6,0,TAU); c.fill();
    drawFace(c,-3);
  }else if(form==='pan'){
    c.fillStyle='#d99a4e'; rr(c,-18,-11,36,25,9); c.fill();
    c.fillStyle='#f3cf8e'; rr(c,-16,-13,32,21,9); c.fill();
    c.strokeStyle='#d99a4e'; c.lineWidth=1.5; c.lineCap='round';
    for(const x of [-9,0,9]){ c.beginPath(); c.moveTo(x-2,-11); c.lineTo(x+2,-8); c.stroke(); }
    drawFace(c,-2);
  }else if(form==='obake'){
    c.globalAlpha*=phasing?0.45:0.9;
    c.fillStyle='#f7f4ff';
    c.beginPath(); c.moveTo(-15,14); c.lineTo(-15,-3); c.arc(0,-3,15,Math.PI,0); c.lineTo(15,14);
    for(let i=0;i<3;i++){ const x0=15-i*10, w=Math.sin(t*6+i)*1.5; c.quadraticCurveTo(x0-5,8+w,x0-10,14); }
    c.closePath(); c.fill();
    drawFace(c,-3);
  }else if(form==='penguin'){
    c.fillStyle='#f5a94a'; c.beginPath(); c.ellipse(-6,18,5,2.6,0,0,TAU); c.ellipse(6,18,5,2.6,0,0,TAU); c.fill();
    c.fillStyle='#2b3a67';
    const fl=Math.sin(t*6)*0.25;
    c.save(); c.translate(-15,2); c.rotate(0.5+fl); c.beginPath(); c.ellipse(0,0,4,9,0,0,TAU); c.fill(); c.restore();
    c.save(); c.translate(15,2); c.rotate(-0.5-fl); c.beginPath(); c.ellipse(0,0,4,9,0,0,TAU); c.fill(); c.restore();
    c.beginPath(); c.ellipse(0,0,16,18.5,0,0,TAU); c.fill();
    c.fillStyle='#fffdf7'; c.beginPath(); c.ellipse(0,3,12,14,0,0,TAU); c.fill();
    drawFace(c,-2);
  }
  c.restore();
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function starPath(c,x,y,r,rot){
  c.beginPath();
  for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4, rad=i%2?r*0.42:r; c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad); }
  c.closePath();
}

/* ---------- 敵の絵（仮：Canvasで描いて1枚絵にしておく。ENEMY_SPRITES にPNGを入れれば差し替わる） ----------
   絵は 112×112 の箱の中心が体の中心、体の半径が32のつもりで描く。右向き（または正面）。 */
const ART=112, OUTL='rgba(255,255,255,.62)';
function blob(g,fill,els){   // 楕円の集まりを、白いふちどり付きで塗る
  g.strokeStyle=OUTL; g.lineWidth=5;
  for(const e of els){ g.beginPath(); g.ellipse(e[0],e[1],e[2],e[3]||e[2],e[4]||0,0,TAU); g.stroke(); }
  g.fillStyle=fill;
  for(const e of els){ g.beginPath(); g.ellipse(e[0],e[1],e[2],e[3]||e[2],e[4]||0,0,TAU); g.fill(); }
}
function dot(g,x,y,r,fill,ry){ g.fillStyle=fill; g.beginPath(); g.ellipse(x,y,r,ry||r,0,0,TAU); g.fill(); }
function tri(g,fill,a,b,c2,outline){ g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c2[0],c2[1]); g.closePath();
  if(outline){ g.strokeStyle=OUTL; g.lineWidth=5; g.lineJoin='round'; g.stroke(); } g.fillStyle=fill; g.fill(); }
function brows(g){ g.strokeStyle='#2a2233'; g.lineWidth=3.5; g.lineCap='round';
  g.beginPath(); g.moveTo(-19,-12); g.lineTo(-6,-6); g.moveTo(19,-12); g.lineTo(6,-6); g.stroke(); }
function artCat(g,body,stripe,eye,boss){
  g.lineCap='round';
  g.strokeStyle=OUTL; g.lineWidth=13; g.beginPath(); g.moveTo(22,22); g.quadraticCurveTo(48,18,42,-8); g.stroke();
  g.strokeStyle=body; g.lineWidth=8; g.stroke();
  tri(g,body,[-28,-14],[-22,-44],[-4,-26],true); tri(g,body,[28,-14],[22,-44],[4,-26],true);
  blob(g,body,[[0,4,32,28]]);
  tri(g,'#ffb6c4',[-23,-20],[-21,-36],[-11,-26]); tri(g,'#ffb6c4',[23,-20],[21,-36],[11,-26]);
  g.strokeStyle=stripe; g.lineWidth=3.5; g.beginPath();
  for(const x of [-8,0,8]){ g.moveTo(x,-23+Math.abs(x)*0.25); g.lineTo(x,-13); } g.stroke();
  if(boss){ dot(g,-12,2,6.5,eye,7.5); dot(g,12,2,6.5,eye,7.5); dot(g,-12,2,1.8,'#2a2233',6); dot(g,12,2,1.8,'#2a2233',6); brows(g); }
  else{ dot(g,-12,2,3.6,eye,5); dot(g,12,2,3.6,eye,5); dot(g,-11,0,1.2,'#fff'); dot(g,13,0,1.2,'#fff'); }
  tri(g,'#ff9db0',[-3,9],[3,9],[0,13]);
  g.strokeStyle='#4a3a3a'; g.lineWidth=1.8; g.beginPath(); g.arc(-3.5,14,3.5,0,Math.PI); g.moveTo(7,14); g.arc(3.5,14,3.5,0,Math.PI);
  g.moveTo(-17,11); g.lineTo(-30,8); g.moveTo(-17,15); g.lineTo(-30,17); g.moveTo(17,11); g.lineTo(30,8); g.moveTo(17,15); g.lineTo(30,17); g.stroke();
  dot(g,-19,12,3.5,'rgba(255,150,170,.5)'); dot(g,19,12,3.5,'rgba(255,150,170,.5)');
}
function artCrow(g,body,sheen,eye,boss){
  blob(g,body,[[-32,2,19,10,-0.5],[32,2,19,10,0.5],[0,2,27,27]]);
  tri(g,body,[-6,-22],[0,-38],[6,-22],true); dot(g,0,-18,8,body);
  dot(g,0,12,16,sheen,12);
  dot(g,-10,-4,6.5,'#fff'); dot(g,10,-4,6.5,'#fff'); dot(g,-9,-3,3.2,eye); dot(g,11,-3,3.2,eye);
  tri(g,'#f5b942',[-7,5],[7,5],[0,18]);
  if(boss) brows(g);
}
const ENEMY_DRAW = {

    g.strokeStyle=B; g.lineWidth=3; g.beginPath(); g.moveTo(30,-18); g.quadraticCurveTo(38,-34,48,-32); g.moveTo(20,-19); g.quadraticCurveTo(20,-36,30,-40); g.stroke();
    dot(g,31,-4,5.5,'#fff'); dot(g,32.5,-3.5,2.8,'#2a2233'); dot(g,26,8,3.5,'rgba(255,150,170,.6)');
  },
  bee(g){

    blob(g,'#ffd24a',[[0,5,31,26]]);
    g.save(); g.beginPath(); g.ellipse(0,5,31,26,0,0,TAU); g.clip(); g.fillStyle='#7a4b38'; g.fillRect(-24,-30,9,70); g.fillRect(-6,-30,9,70); g.restore();
    dot(g,17,1,4.2,'#2a2233',5.5); dot(g,18.5,-1,1.4,'#fff'); dot(g,21,11,3.5,'rgba(255,130,150,.6)');
    g.strokeStyle='#7a4b38'; g.lineWidth=2.5; g.lineCap='round'; g.beginPath(); g.moveTo(20,-18); g.quadraticCurveTo(28,-32,36,-28); g.stroke();
  },
  cat(g){ artCat(g,'#f2a85e','#c97a35','#3b3352',false); },

  dog(g){
    blob(g,'#8f5d3c',[[-29,-4,10,21,0.3],[29,-4,10,21,-0.3]]);

    g.strokeStyle='#4a3a3a'; g.lineWidth=1.8; g.beginPath(); g.moveTo(0,11.5); g.lineTo(0,16); g.arc(-3.5,16,3.5,0,Math.PI); g.moveTo(7,16); g.arc(3.5,16,3.5,0,Math.PI); g.stroke();
    dot(g,0,22,3.6,'#ff8fa8',4.5);
  },
  bosscat(g){ artCat(g,'#5b556e','#3b3650','#ffd84a',true); },
  bosscrow(g){ artCrow(g,'#2a2440','#5a3f8a','#c2334d',true); },
  hand(g){
    const S='#f6cfae';
    g.strokeStyle=OUTL; g.lineWidth=5; g.fillStyle='#7fa7d9'; rr(g,-21,26,42,28,6); g.stroke(); g.fill();
    blob(g,S,[[-22,-22,7.5,19,-0.16],[-7.5,-31,7.5,21,-0.05],[7.5,-31,7.5,21,0.05],[22,-22,7.5,19,0.16],[-35,8,7.5,17,-0.9],[0,10,29,26]]);
    for(const f of [[-24,-37],[-8,-48],[8,-48],[24,-37]]) dot(g,f[0],f[1],4,'#fff0e2',5);
    g.strokeStyle='#dba983'; g.lineWidth=2.5; g.lineCap='round';
    g.beginPath(); g.moveTo(-16,4); g.quadraticCurveTo(0,-4,18,4); g.moveTo(-14,16); g.quadraticCurveTo(0,10,16,18); g.stroke();
  },
};
const enemyCv={}, enemyImg={};
for(const k in ENEMY_SPRITES){ if(ENEMY_SPRITES[k]){ const im=new Image(); im.src=ENEMY_SPRITES[k]; enemyImg[k]=im; } }
function enemyArt(type){
  if(!enemyCv[type]){
    const px=ETYPES[type].boss?448:224, cvs=document.createElement('canvas'); cvs.width=cvs.height=px;
    const g=cvs.getContext('2d'); g.scale(px/ART,px/ART); g.translate(ART/2,ART/2); ENEMY_DRAW[type](g);
    enemyCv[type]=cvs;
  }
  return enemyCv[type];
}
function drawEnemy(c,e){
  const r=e.r, ey=e.y-e.alt, up=clamp(e.alt/170,0,1);
  c.fillStyle='rgba(0,0,0,'+(0.26-0.12*up).toFixed(2)+')'; c.beginPath(); c.ellipse(e.x,e.y+r*0.8,r*(0.95-0.35*up),r*(0.32-0.1*up),0,0,TAU); c.fill();
  c.save(); c.translate(e.x,ey);
  let sx=e.face<0?-1:1, sy=1, rot=Math.sin(animT*6+e.wob)*0.07;
  if(e.ai==='cat'){ if(e.st===1){ sy=0.76; rot=0; } else if(e.st===2){ sx*=1.12; sy=0.9; } }
  else if(e.ai==='bee') c.translate(0,Math.sin(animT*14+e.wob)*2.5);
  else if(e.ai==='dog'){ if(e.st===1) rot=Math.sin(animT*45)*0.06; else if(e.st===2){ sx*=1.1; sy=0.92; } }
  else if(e.ai==='crow'){ sy=e.st===2?0.85:1+Math.sin(animT*12+e.wob)*0.07; if(e.st===1) rot=Math.sin(animT*45)*0.08; }
  else if(e.ai==='hand'){ rot=0; if(e.st===1) c.translate(rand(-2,2),rand(-2,2)); }
  c.rotate(rot); c.scale(sx,sy);
  const im=enemyImg[e.type];
  if(im&&im.complete&&im.naturalWidth){ const h=r*2.7, w=h*im.naturalWidth/im.naturalHeight; c.drawImage(im,-w/2,-h/2,w,h); }
  else{ const size=ART*r/32; c.drawImage(enemyArt(e.type),-size/2,-size/2,size,size); }
  c.restore();
  const col=e.flash>0?'255,255,255':e.stun>0?'120,210,240':e.burn>0?'255,130,50':e.poison>0?'120,200,90':e.slow>0?'90,130,220':null;
  if(col){ c.fillStyle='rgba('+col+','+(e.flash>0?0.6:0.38)+')'; c.beginPath(); c.arc(e.x,ey,r*0.95,0,TAU); c.fill(); }
  if(e.boss){
    const bw=r*1.6, by=ey-r*1.5-10; c.fillStyle='rgba(10,10,25,.7)'; c.fillRect(e.x-bw/2,by,bw,6);
    c.fillStyle='#ff9db0'; c.fillRect(e.x-bw/2,by,bw*clamp(e.hp/e.maxHp,0,1),6);
  }
}

/* ---------- 描画 ---------- */
function hash(x,y){ let h=(x*374761393+y*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function render(){
  const c=ctx, p=G.p;
  c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  let cx=p.x-VW/2, cy=p.y-VH/2;
  if(G.shake>0){ cx+=rand(-4,4); cy+=rand(-4,4); }
  c.fillStyle='#12263a'; c.fillRect(0,0,VW,VH);
  c.save(); c.translate(-cx,-cy);

  // 星空の草原
  const T=160, x0=Math.floor(cx/T), y0=Math.floor(cy/T), x1=Math.floor((cx+VW)/T), y1=Math.floor((cy+VH)/T);
  c.lineCap='round';
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const bx=tx*T, by=ty*T;
    c.strokeStyle='#1f4d4f'; c.lineWidth=2;
    for(let i=0;i<3;i++){
      const gx=bx+hash(tx*7+i,ty)*T, gy=by+hash(tx,ty*7+i)*T;
      c.beginPath(); c.moveTo(gx-4,gy); c.lineTo(gx-6,gy-7); c.moveTo(gx,gy); c.lineTo(gx,gy-9); c.moveTo(gx+4,gy); c.lineTo(gx+6,gy-7); c.stroke();
    }
    for(let i=0;i<2;i++){
      const sx=bx+hash(tx*13+i,ty+5)*T, sy=by+hash(tx+9,ty*13+i)*T, tw=0.35+0.3*Math.sin(animT*1.7+hash(tx+i,ty)*40);
      c.fillStyle='rgba(255,236,170,'+tw.toFixed(2)+')'; starPath(c,sx,sy,3.2,0); c.fill();
    }
  }

  // ほのお
  for(const z of G.zones){
    const a=clamp(z.life/0.5,0,1), fl=0.85+0.15*Math.sin(animT*18+z.x);
    c.fillStyle='rgba(255,120,40,'+(0.22*a).toFixed(2)+')'; c.beginPath(); c.arc(z.x,z.y,z.r,0,TAU); c.fill();
    c.fillStyle='rgba(255,200,90,'+(0.3*a).toFixed(2)+')'; c.beginPath(); c.arc(z.x,z.y,z.r*0.55*fl,0,TAU); c.fill();
  }

  // 回復エリア
  for(const h of G.herbs){
    const al=clamp(h.life/1.5,0,1);
    c.fillStyle='rgba(120,220,110,'+(0.2*al).toFixed(2)+')'; c.beginPath(); c.arc(h.x,h.y,h.r,0,TAU); c.fill();
    c.strokeStyle=(h.trod?'rgba(255,170,120,':'rgba(170,240,150,')+(0.8*al).toFixed(2)+')'; c.lineWidth=2.5; c.setLineDash([8,6]); c.stroke(); c.setLineDash([]);
    c.fillStyle='rgba(127,211,94,'+(0.85*al).toFixed(2)+')';
    for(let i=0;i<5;i++){ const a=i/5*TAU+0.3, lx=h.x+Math.cos(a)*h.r*0.55, ly=h.y+Math.sin(a)*h.r*0.55;
      c.beginPath(); c.ellipse(lx-4,ly,5,2.5,-0.7,0,TAU); c.ellipse(lx+4,ly,5,2.5,0.7,0,TAU); c.fill(); }
  }

  // かけら・ハート
  for(const g of G.gems){
    const y=g.y+Math.sin(animT*4+g.ph)*2;
    if(g.heart){
      c.fillStyle='#ff8fa8'; c.beginPath(); c.arc(g.x-3,y-2,4,0,TAU); c.arc(g.x+3,y-2,4,0,TAU); c.fill();
      c.beginPath(); c.moveTo(g.x-7,y-0.5); c.lineTo(g.x,y+8); c.lineTo(g.x+7,y-0.5); c.closePath(); c.fill();
    }else{ c.fillStyle=g.v>1?'#9fe8ff':'#ffe27a'; starPath(c,g.x,y,g.v>1?7:5.5,animT*2+g.ph); c.fill(); }
  }

  // ビームの輪
  if(G.sk.halo && state!=='title'){
    const {R,w}=haloGeom(), pu=G.haloPulse>0?1:0;
    c.strokeStyle='rgba(159,232,255,'+(0.22+0.3*pu)+')'; c.lineWidth=w; c.beginPath(); c.arc(p.x,p.y,R,0,TAU); c.stroke();
    c.strokeStyle='rgba(255,255,255,'+(0.45+0.4*pu)+')'; c.lineWidth=2; c.beginPath(); c.arc(p.x,p.y,R,0,TAU); c.stroke();
  }

  // 予告（カラス・手の落下地点、いぬの突進方向）
  for(const e of G.enemies){
    if((e.ai==='crow'||e.ai==='hand')&&(e.st===1||e.st===2)){
      c.fillStyle='rgba(255,90,90,.16)'; c.beginPath(); c.arc(e.tx,e.ty,e.r,0,TAU); c.fill();
      c.strokeStyle='rgba(255,120,120,.85)'; c.lineWidth=2.5; c.setLineDash([7,6]); c.stroke(); c.setLineDash([]);
    }else if(e.ai==='dog'&&e.st===1){
      c.strokeStyle='rgba(255,120,90,.2)'; c.lineWidth=e.r*1.6; c.lineCap='butt';
      c.beginPath(); c.moveTo(e.x,e.y); c.lineTo(e.x+e.dx*270,e.y+e.dy*270); c.stroke(); c.lineCap='round';
    }
  }
  // 敵（地上）
  for(const e of G.enemies) if(e.alt<25) drawEnemy(c,e);

  // 弾
  for(const b of G.bullets){
    if(b.kind==='star'){ c.fillStyle='#ffe27a'; starPath(c,b.x,b.y,b.r+2,b.rot); c.fill(); }
    else if(b.kind==='homing'){ c.fillStyle='rgba(255,143,168,.4)'; c.beginPath(); c.arc(b.x-b.vx*0.03,b.y-b.vy*0.03,b.r*0.8,0,TAU); c.fill();
      c.fillStyle='#ff8fa8'; starPath(c,b.x,b.y,b.r+2,b.rot); c.fill(); }
    else if(b.kind==='ice'){ c.fillStyle='#bfefff'; starPath(c,b.x,b.y,b.r+2,Math.PI/8); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(b.x,b.y,2.5,0,TAU); c.fill(); }
    else if(b.kind==='wave'){
      const a=Math.atan2(b.vy,b.vx), al=clamp(b.life/0.3,0,1);
      c.fillStyle='rgba(110,190,255,'+(0.3*al).toFixed(2)+')'; c.beginPath(); c.arc(b.x,b.y,b.r,0,TAU); c.fill();
      c.strokeStyle='rgba(255,255,255,'+(0.8*al).toFixed(2)+')'; c.lineWidth=4; c.beginPath(); c.arc(b.x,b.y,b.r,a-1.1,a+1.1); c.stroke();
    }
  }

  // まわる星
  if(G.sk.orbit && state!=='title'){
    const {n,R}=orbitGeom();
    for(let k=0;k<n;k++){ const a=G.orbA+k*TAU/n; c.fillStyle='#fff3b0'; starPath(c,p.x+Math.cos(a)*R,p.y+Math.sin(a)*R,10,a*2); c.fill(); }
  }

  // のるん
  const giant=p.giant>0;
  c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(p.x,p.y+19*(giant?2.3:1),14*(giant?2.3:1),4.5*(giant?2:1),0,0,TAU); c.fill();
  if(p.form==='obake'&&p.phaseCd>0&&p.phase<=0){
    c.strokeStyle='rgba(220,205,255,.6)'; c.lineWidth=2.5;
    c.beginPath(); c.arc(p.x,p.y+19,18,-Math.PI/2,-Math.PI/2+TAU*(1-p.phaseCd/PERK.obakeCd)); c.stroke();
  }
  c.save(); c.translate(p.x,p.y+Math.sin(animT*11)*2.2*p.bob);
  c.rotate(p.tilt); c.scale(p.flip*(giant?2.3:1),giant?2.3:1);
  if(p.inv>0&&p.phase<=0&&!giant&&Math.floor(animT*18)%2) c.globalAlpha=0.45;
  drawNorun(c,p.form,animT,p.phase>0);
  c.restore();

  // 敵（上空）
  for(const e of G.enemies) if(e.alt>=25) drawEnemy(c,e);

  // かみなり
  c.lineCap='round'; c.lineJoin='round';
  for(const b of G.bolts){
    const al=clamp(b.life/0.22,0,1);
    c.beginPath(); c.moveTo(b.pts[0][0],b.pts[0][1]); for(let i=1;i<b.pts.length;i++) c.lineTo(b.pts[i][0],b.pts[i][1]);
    c.strokeStyle='rgba(159,232,255,'+(0.5*al).toFixed(2)+')'; c.lineWidth=7; c.stroke();
    c.strokeStyle='rgba(255,255,255,'+al.toFixed(2)+')'; c.lineWidth=2.5; c.stroke();
  }
  // 星のシャワー
  for(const f of G.falls){
    const x=f.e.x+f.t*90, y=f.e.y-f.t*520;
    c.strokeStyle='rgba(255,226,122,.5)'; c.lineWidth=4; c.beginPath(); c.moveTo(x,y); c.lineTo(x+14,y-80); c.stroke();
    c.fillStyle='#ffe27a'; starPath(c,x,y,11,animT*6); c.fill();
  }
  // きらきら
  for(const f of G.fx){ c.globalAlpha=clamp(f.life/f.max,0,1); c.fillStyle=f.color; c.beginPath(); c.arc(f.x,f.y,f.r,0,TAU); c.fill(); }
  c.globalAlpha=1;

  drawFog(c,cx,cy);
  c.restore();

  if(G.flash){ c.fillStyle='rgba('+G.flash.c+','+clamp(G.flash.t*0.9,0,0.45).toFixed(2)+')'; c.fillRect(0,0,VW,VH); }

  if(stick.on&&state==='play'){
    const ox=stick.ox/SC, oy=stick.oy/SC, R=46/SC;
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=2; c.beginPath(); c.arc(ox,oy,R,0,TAU); c.stroke();
    c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.arc(ox+stick.x*R,oy+stick.y*R,R*0.42,0,TAU); c.fill();
  }
}
function drawFog(c,cx,cy){
  const W=CFG.WORLD, m=150, far=1600, col='rgba(196,186,255,', solid=col+'0.92)', clear=col+'0)';
  let g;
  if(cx<m){ g=c.createLinearGradient(0,0,m,0); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(0,-far,m,W+far*2); c.fillStyle=solid; c.fillRect(-far,-far,far,W+far*2); }
  if(cx+VW>W-m){ g=c.createLinearGradient(W,0,W-m,0); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(W-m,-far,m,W+far*2); c.fillStyle=solid; c.fillRect(W,-far,far,W+far*2); }
  if(cy<m){ g=c.createLinearGradient(0,0,0,m); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(-far,0,W+far*2,m); c.fillStyle=solid; c.fillRect(-far,-far,W+far*2,far); }
  if(cy+VH>W-m){ g=c.createLinearGradient(0,W,0,W-m); g.addColorStop(0,solid); g.addColorStop(1,clear); c.fillStyle=g; c.fillRect(-far,W-m,W+far*2,m); c.fillStyle=solid; c.fillRect(-far,W,W+far*2,far); }
}

/* ---------- HUD ---------- */
const hudCache={};
function setTxt(id,v){ if(hudCache[id]!==v){ hudCache[id]=v; $(id).textContent=v; } }
function setW(id,v){ v=Math.round(v*100)+'%'; if(hudCache[id]!==v){ hudCache[id]=v; $(id).style.width=v; } }
function updateHud(){
  const p=G.p;
  setW('hpfill',clamp(p.hp/p.maxHp,0,1));
  setTxt('hptxt',Math.ceil(p.hp)+' / '+p.maxHp);
  setTxt('time',fmtTime(Math.ceil(G.limit-G.t)));
  if(hudCache.hot!==G.finale){ hudCache.hot=G.finale; $('time').classList.toggle('hot',G.finale); }
  setTxt('lv','Lv '+G.level);
  setW('xpfill',clamp(G.xp/G.need,0,1));
  setTxt('kills',G.kills+' たおした');
  setTxt('skills',Object.keys(G.sk).map(id=>SKILLS[id].icon+G.sk[id]).join('  '));
  const g=Math.floor(G.ult/G.ultNeed*100);
  if(hudCache.ult!==g){ hudCache.ult=g; const b=$('btnUlt'); b.style.setProperty('--g',g); b.classList.toggle('ready',g>=100); }
}

/* ---------- ループ ---------- */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; animT+=dt;
  if(state==='play'){
    update(dt);
    if(state==='play'&&G.pending>0) openLevelUp();
    updateHud();
  }
  render();
}

/* ---------- 起動 ---------- */
sndLabel(); resize(); newGame(save.form,save.limit); buildTitle();
window.__norun={ get G(){return G;}, get state(){return state;}, get save(){return save;}, start, pickCard, useUlt, input:dbg, CFG };   // デバッグ用
requestAnimationFrame(frame);
})();
</script>
